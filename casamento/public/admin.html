<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf7f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17140f" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>Painel dos noivos</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<!-- Entrada -->
<main class="page" id="view-login" hidden>
  <header class="page-head">
    <p class="eyebrow">Área reservada</p>
    <h1>Painel dos noivos</h1>
    <hr class="rule">
    <p class="lede">Aqui ficam todas as fotos que os convidados enviaram.</p>
  </header>

  <form class="panel" id="login-form">
    <label class="field">
      <span>Senha</span>
      <input type="password" id="password" autocomplete="current-password" required autofocus>
    </label>
    <button type="submit" class="btn btn-block" id="login-submit">Entrar</button>
    <p class="alert alert-error" id="login-error" hidden></p>
  </form>

  <footer class="page-foot">
    <a href="/">Voltar para a página dos convidados</a>
  </footer>
</main>

<!-- Painel -->
<main class="page page-wide" id="view-panel" hidden>
  <header class="panel-head">
    <div>
      <p class="eyebrow">Painel dos noivos</p>
      <h1 id="panel-title">Fotos do casamento</h1>
    </div>
    <button type="button" class="btn btn-ghost" id="btn-logout">Sair</button>
  </header>

  <section class="stats" id="stats" aria-label="Resumo"></section>

  <section class="toolbar">
    <div class="btn-row">
      <button type="button" class="btn" id="btn-download">Baixar todas (.zip)</button>
      <a class="btn btn-secondary" href="/qr">QR Code das mesas</a>
      <button type="button" class="btn btn-secondary" id="btn-refresh">Atualizar</button>
    </div>
    <label class="checkbox">
      <input type="checkbox" id="show-hidden" checked>
      <span>Mostrar também as fotos ocultas</span>
    </label>
  </section>

  <p class="alert alert-error" id="panel-error" hidden></p>

  <section class="grid" id="grid" aria-label="Fotos recebidas"></section>
  <p class="empty" id="empty" hidden>Nenhuma foto ainda. Assim que um convidado enviar, ela aparece aqui.</p>
</main>

<!-- Foto ampliada -->
<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Foto">
  <button type="button" class="viewer-close" id="viewer-close" aria-label="Fechar">×</button>
  <button type="button" class="viewer-nav viewer-prev" id="viewer-prev" aria-label="Foto anterior">‹</button>
  <button type="button" class="viewer-nav viewer-next" id="viewer-next" aria-label="Próxima foto">›</button>

  <figure class="viewer-figure">
    <img id="viewer-image" alt="">
    <figcaption class="viewer-caption">
      <p class="viewer-guest" id="viewer-guest"></p>
      <p class="viewer-message" id="viewer-message"></p>
      <p class="viewer-meta" id="viewer-meta"></p>
      <div class="btn-row">
        <a class="btn btn-secondary" id="viewer-download" download>Baixar original</a>
        <button type="button" class="btn btn-secondary" id="viewer-hide">Ocultar</button>
        <button type="button" class="btn btn-danger" id="viewer-delete">Excluir</button>
      </div>
    </figcaption>
  </figure>
</div>

<script src="/js/admin.js"></script>
</body>
</html>
