# Broker MQTT da central Nexo.
#
# Escuta APENAS dentro da rede do compose — nenhuma porta é publicada no
# host (confira o docker-compose.yml: o serviço mosquitto não tem
# `ports:`). Por isso o acesso anônimo aqui não é a fragilidade que
# pareceria num broker exposto: só os contêineres nexo e zigbee2mqtt
# alcançam este processo.
#
# Se um dia o broker precisar ser publicado (integração externa),
# PRIMEIRO crie usuários:
#   docker compose exec mosquitto mosquitto_passwd -c /mosquitto/data/passwd nexo
# e troque as duas linhas de auth por:
#   allow_anonymous false
#   password_file /mosquitto/data/passwd

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

# O relato retido de cada aparelho sobrevive a reinício do broker —
# a central reabre já sabendo o último estado conhecido.
autosave_interval 60

log_dest stdout
log_type warning
