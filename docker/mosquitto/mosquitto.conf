# Broker MQTT da central Nexo.
#
# O listener 1883 escuta APENAS dentro da rede do compose — não é
# publicado no host (confira o docker-compose.yml: o serviço mosquitto
# não tem `ports:` para ele). Por isso o acesso anônimo aqui não é a
# fragilidade que pareceria num broker exposto: só os contêineres nexo
# e zigbee2mqtt alcançam este processo.
#
# per_listener_settings deixa cada listener com a própria política de
# auth — é o que permite manter o 1883 interno anônimo E abrir um 1884
# autenticado para as pontes, sem mexer em credencial de contêiner.
per_listener_settings true

listener 1883
allow_anonymous true

# ── Listener das pontes de E/S (ESP32 na LAN) ────────────────────────
# Desligado de fábrica. Para habilitar (o passo a passo completo está
# em docs/pontes-mqtt.md):
#   1. crie a credencial da ponte:
#        docker compose exec mosquitto mosquitto_passwd -c /mosquitto/data/pontes.passwd ponte-portao
#   2. descomente as três linhas abaixo
#   3. descomente a porta "1884:1884" no docker-compose.yml
#   4. docker compose restart mosquitto
# Sem senha não abre: um broker escutando a LAN nunca fica anônimo.
#
#listener 1884
#allow_anonymous false
#password_file /mosquitto/data/pontes.passwd

persistence true
persistence_location /mosquitto/data/

# O relato retido de cada aparelho sobrevive a reinício do broker —
# a central reabre já sabendo o último estado conhecido.
autosave_interval 60

log_dest stdout
log_type warning
