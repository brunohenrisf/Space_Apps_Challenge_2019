# Modelo de APLICAÇÃO EM CONTÊINER (Node, Python, PHP, WordPress...).
# Diferente do site estático: em vez de servir arquivos, o nginx repassa a
# requisição para o contêiner da aplicação, alcançado pelo NOME DO SERVIÇO
# na rede "proxy".
server {
    listen 80;
    server_name app.exemplo.com.br;

    include /etc/nginx/cloudflare-real-ip.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Limite de upload (o padrão do nginx é 1 MB e quebra envio de arquivo)
    client_max_body_size 50m;

    location / {
        # "meu-app" é o nome do serviço no compose da aplicação;
        # 3000 é a porta INTERNA em que ela escuta.
        proxy_pass http://meu-app:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;   # o TLS termina na Cloudflare

        # WebSocket (necessário para Next.js em dev, Socket.IO, HMR, chat)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Aplicações lentas (relatórios, uploads grandes) precisam de folga
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
