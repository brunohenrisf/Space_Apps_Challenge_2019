# Servidor padrão: responde a qualquer domínio que NÃO tenha um .conf próprio.
# O 444 fecha a conexão sem responder nada — evita que seu servidor apareça
# em varreduras respondendo por domínios que não são seus.
server {
    listen 80 default_server;
    server_name _;

    # Exceção: o healthcheck do compose precisa de resposta.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 444;
    }
}
