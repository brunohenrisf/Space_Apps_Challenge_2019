# Modelo de site. Copie este arquivo trocando o nome do domínio em três
# lugares: nome do arquivo, server_name e root.
server {
    listen 80;
    server_name exemplo.com.br www.exemplo.com.br;
    root /sites/exemplo.com.br;
    index index.html index.htm;

    include /etc/nginx/cloudflare-real-ip.conf;

    # Cabeçalhos de segurança básicos
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compressão
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Arquivos estáticos ficam em cache no navegador por 30 dias
    location ~* \.(jpg|jpeg|png|gif|ico|webp|avif|css|js|svg|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # try_files com fallback para index.html faz Single Page Application
    # (React, Vue, Svelte) funcionar com rotas no cliente.
    # Para site estático comum, troque a última opção por =404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Não servir arquivos ocultos (.git, .env, .htaccess)
    location ~ /\. {
        deny all;
    }
}
