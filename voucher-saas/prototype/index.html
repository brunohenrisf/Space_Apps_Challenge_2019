<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b16" />
  <title>ConectaVoucher — Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/app.css" />
  <style>
    .home { text-align: center; padding-top: 8px; }
    .home .hero-logo {
      width: 72px; height: 72px; margin: 6px auto 18px;
      border-radius: 20px; overflow: hidden;
      box-shadow: 0 14px 34px -10px rgba(79,124,255,.8);
    }
    .home .hero-logo img { width: 100%; height: 100%; }
    .access-card {
      display: flex; align-items: center; gap: 14px; text-align: left;
      border: 1px solid var(--line); border-radius: var(--radius);
      padding: 18px; margin-bottom: 14px; background: var(--glass);
      backdrop-filter: blur(20px) saturate(135%); -webkit-backdrop-filter: blur(20px) saturate(135%);
      box-shadow: var(--shadow-sm); cursor: pointer; text-decoration: none; color: inherit;
      transition: border-color .18s, transform .12s, box-shadow .18s;
    }
    .access-card:active { transform: scale(.99); }
    .access-card:hover { border-color: var(--line-strong); transform: translateY(-2px); }
    .access-card .ac-ico {
      width: 52px; height: 52px; flex-shrink: 0; border-radius: 14px;
      display: grid; place-items: center; font-size: 26px;
      border: 1px solid var(--line);
    }
    .access-card.client .ac-ico { background: var(--grad-soft); color: var(--brand-c); }
    .access-card.admin .ac-ico { background: var(--glass-2); color: var(--ink); }
    .access-card .ac-title { font-weight: 700; font-size: 16px; }
    .access-card .ac-desc { font-size: 12.5px; color: var(--ink-3); }
    .access-card .ac-arrow { margin-left: auto; color: var(--ink-3); font-size: 20px; }
  </style>
</head>
<body>
  <div class="app-bg">
    <div class="phone">
      <header class="topbar">
        <div class="logo"><img src="assets/img/logo.svg" alt="ConectaVoucher" /></div>
        <div>
          <div class="brand-name">ConectaVoucher</div>
          <div class="brand-sub">Internet por voucher em eventos</div>
        </div>
      </header>

      <main class="content home" style="padding-bottom:24px">
        <div class="hero-logo"><img src="assets/img/logo.svg" alt="ConectaVoucher" /></div>
        <h1 class="title" style="text-align:center">Bem-vindo ao portal</h1>
        <p class="lead" style="text-align:center">Selecione como você quer acessar.</p>

        <a class="access-card client" href="portal.html">
          <div class="ac-ico">📱</div>
          <div>
            <div class="ac-title">Sou cliente</div>
            <div class="ac-desc">Comprar um voucher e conectar na internet do evento</div>
          </div>
          <span class="ac-arrow">›</span>
        </a>

        <a class="access-card admin" href="admin.html">
          <div class="ac-ico">🛠️</div>
          <div>
            <div class="ac-title">Sou administrador</div>
            <div class="ac-desc">Gerenciar eventos, planos, vendas e configurações</div>
          </div>
          <span class="ac-arrow">›</span>
        </a>

        <p class="helper" style="margin-top:22px">Esqueleto para validação · dados fictícios</p>
      </main>
    </div>
  </div>
</body>
</html>
