<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1e40af" />
  <title>ConectaVoucher — Portal</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <style>
    .home { text-align: center; padding-top: 8px; }
    .home .hero-logo {
      width: 68px; height: 68px; margin: 6px auto 16px;
      display: grid; place-items: center; font-size: 34px;
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      color: #fff; border-radius: 20px; box-shadow: var(--shadow);
    }
    .access-card {
      display: flex; align-items: center; gap: 14px; text-align: left;
      border: 1.5px solid var(--border); border-radius: var(--radius);
      padding: 18px; margin-bottom: 14px; background: var(--surface);
      box-shadow: var(--shadow-sm); cursor: pointer; text-decoration: none; color: inherit;
      transition: border-color .15s, transform .1s, box-shadow .15s;
    }
    .access-card:active { transform: scale(.99); }
    .access-card:hover { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
    .access-card .ac-ico {
      width: 52px; height: 52px; flex-shrink: 0; border-radius: 14px;
      display: grid; place-items: center; font-size: 26px;
    }
    .access-card.client .ac-ico { background: var(--brand-soft); color: var(--brand); }
    .access-card.admin .ac-ico { background: #f1f5f9; color: #0f172a; }
    .access-card .ac-title { font-weight: 700; font-size: 16px; }
    .access-card .ac-desc { font-size: 12.5px; color: var(--muted); }
    .access-card .ac-arrow { margin-left: auto; color: var(--muted); font-size: 20px; }
  </style>
</head>
<body>
  <div class="app-bg">
    <div class="phone">
      <header class="topbar">
        <div class="logo">📶</div>
        <div>
          <div class="brand-name">ConectaVoucher</div>
          <div class="brand-sub">Internet por voucher em eventos</div>
        </div>
      </header>

      <main class="content home" style="padding-bottom:24px">
        <div class="hero-logo">📶</div>
        <h1 class="title" style="text-align:center">Bem-vindo ao portal</h1>
        <p class="lead" style="text-align:center">Selecione como você quer acessar.</p>

        <a class="access-card client" href="portal.html">
          <div class="ac-ico">📱</div>
          <div>
            <div class="ac-title">Sou cliente</div>
            <div class="ac-desc">Comprar um voucher e conectar na internet do evento</div>
          </div>
          <span class="ac-arrow">›</span>
        </a>

        <a class="access-card admin" href="admin.html">
          <div class="ac-ico">🛠️</div>
          <div>
            <div class="ac-title">Sou administrador</div>
            <div class="ac-desc">Gerenciar eventos, planos, vendas e configurações</div>
          </div>
          <span class="ac-arrow">›</span>
        </a>

        <p class="helper" style="margin-top:22px">Esqueleto para validação · dados fictícios</p>
      </main>
    </div>
  </div>
</body>
</html>
