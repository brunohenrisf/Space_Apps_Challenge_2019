<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Nexo</title>
<meta name="description" content="Painel de automação residencial local. Funciona na sua rede, sem nuvem.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#100E0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nexo">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<style>
/* ─────────────────────────────────────────────────────────────
   TOKENS
   Tema claro = cômodo com a luz acesa. Tema escuro = luz apagada.
   Neutros puxados para o quente do âmbar, nunca cinza puro.
   ───────────────────────────────────────────────────────────── */
/* ─────────────────────────────────────────────────────────────
   TOKENS — duas paletas, cada uma com tema claro e escuro.

   ÂMBAR (padrão): a cor é literal. O app manipula luz, então o fundo
   é um cômodo apagado e o acento é âmbar incandescente, querendo
   dizer uma coisa só — aceso. Neutros puxados para o quente.

   AURORA: índigo e violeta sobre branco levemente azulado, leituras
   do topo em cartões de cor cheia. Vocabulário de app de consumo.

   A ORDEM DOS BLOCOS IMPORTA. Entre `:root[data-palette]` e
   `:root[data-theme]` a especificidade empata, então quem vem depois
   ganha: primeiro os claros, depois os escuros, e aurora sempre
   depois de âmbar.
   ───────────────────────────────────────────────────────────── */

/* ── 1. Âmbar, claro ─────────────────────────────────────────── */
:root{
  --bg:#F4EFE8;
  --surface:#FFFFFF;
  --surface-2:#FBF7F1;
  --surface-3:#EFE7DC;
  --line:#E4DACC;
  --line-soft:#EFE7DC;
  --text:#1C1713;
  --text-dim:#6E6157;
  --text-faint:#9C8E80;
  --accent:#C87F14;
  --accent-fill:#F6A93B;
  --accent-soft:rgba(246,169,59,.14);
  --accent-ink:#3A2508;
  --cool:#2F73AC;
  --alert:#C24A31;
  --alert-soft:rgba(194,74,49,.12);
  --ok:#3D8A61;
  --shadow-1:0 1px 2px rgba(58,37,8,.05), 0 6px 18px -10px rgba(58,37,8,.20);
  --shadow-2:0 24px 60px -20px rgba(58,37,8,.34);
  --scrim:rgba(28,23,19,.42);
  --glass:rgba(255,255,255,.78);
  --chart-bar:#E4D8C6;
  --fill-grad:linear-gradient(180deg,#F6A93B,#E2892A);
  --bloom-default:#F6A93B;
  --tile-on-bg:linear-gradient(170deg,#FFE7BF,#FFD394);
  --tile-on-ink:#3A2508;
  --pill-on-bg:var(--text);
  --pill-on-ink:var(--bg);
  --title-bg:linear-gradient(0deg,var(--text),var(--text));
  /* Leituras do topo: em âmbar são um painel neutro de três casas. */
  --stat-a:var(--surface); --stat-b:var(--surface); --stat-c:var(--surface);
  --stat-ink:var(--text); --stat-key:var(--text-faint);
  --readout-gap:1px; --readout-bg:var(--line-soft);
  --readout-r:0; --readout-border:1px solid var(--line-soft);

  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:30px;
  --ease:cubic-bezier(.32,.72,0,1);

  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}

/* ── 2. Aurora, claro ────────────────────────────────────────── */
:root[data-palette="aurora"]{
  --bg:#F5F7FD;
  --surface:#FFFFFF;
  --surface-2:#F9FBFF;
  --surface-3:#ECF0FB;
  --line:#E2E7F5;
  --line-soft:#EDF1FA;
  --text:#131A2E;
  --text-dim:#5A6480;
  --text-faint:#8D96B0;
  --accent:#5A51E0;
  --accent-fill:#6C63FF;
  --accent-soft:rgba(108,99,255,.12);
  --accent-ink:#FFFFFF;
  --cool:#2B7FD4;
  --alert:#DC3F45;
  --alert-soft:rgba(220,63,69,.10);
  --ok:#1F9E76;
  --shadow-1:0 1px 2px rgba(19,26,46,.04), 0 8px 24px -12px rgba(19,26,46,.16);
  --shadow-2:0 26px 64px -22px rgba(19,26,46,.30);
  --scrim:rgba(15,20,38,.40);
  --glass:rgba(255,255,255,.80);
  --chart-bar:#E3E8F7;
  --fill-grad:linear-gradient(180deg,#7C6BFF,#5B8DEF);
  --bloom-default:#6C63FF;
  --tile-on-bg:linear-gradient(150deg,#7C6BFF,#5B8DEF);
  --tile-on-ink:#FFFFFF;
  --pill-on-bg:var(--accent-fill);
  --pill-on-ink:var(--accent-ink);
  --title-bg:linear-gradient(96deg,#4F8BF0,#7C6BFF 55%,#B25CE0);
  /* Em aurora as três leituras viram cartões de cor cheia, separados. */
  --stat-a:linear-gradient(150deg,#2FD3C6,#1FA3D4);
  --stat-b:linear-gradient(150deg,#FFAA3D,#F5693B);
  --stat-c:linear-gradient(150deg,#FF6E8E,#E0434C);
  --stat-ink:#FFFFFF; --stat-key:rgba(255,255,255,.78);
  --readout-gap:9px; --readout-bg:transparent;
  --readout-r:20px; --readout-border:0;
}

/* ── 3. Âmbar, escuro por preferência do sistema ─────────────── */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#100E0C;
    --surface:#191614;
    --surface-2:#211D1A;
    --surface-3:#2B2622;
    --line:#332C26;
    --line-soft:#251F1B;
    --text:#F6EFE5;
    --text-dim:#A3968A;
    --text-faint:#6F6459;
    --accent:#F6A93B;
    --accent-fill:#F6A93B;
    --accent-soft:rgba(246,169,59,.13);
    --accent-ink:#2A1B06;
    --cool:#7FB6E8;
    --alert:#E8705A;
    --alert-soft:rgba(232,112,90,.14);
    --ok:#5CB98A;
    --shadow-1:0 1px 2px rgba(0,0,0,.34), 0 6px 18px -10px rgba(0,0,0,.6);
    --shadow-2:0 24px 60px -20px rgba(0,0,0,.8);
    --scrim:rgba(6,5,4,.62);
    --glass:rgba(25,22,20,.76);
    --chart-bar:#3B332B;
    --tile-on-bg:linear-gradient(170deg,#5C3F14,#3C2A0E);
    --tile-on-ink:#FFDFA8;
  }
}

/* ── 4. Aurora, escuro por preferência do sistema ────────────── */
@media (prefers-color-scheme: dark){
  :root[data-palette="aurora"]:not([data-theme="light"]){
    --bg:#0B0E1B;
    --surface:#141930;
    --surface-2:#1A2039;
    --surface-3:#222945;
    --line:#2B3355;
    --line-soft:#1E2540;
    --text:#EEF1FA;
    --text-dim:#98A2C0;
    --text-faint:#67718F;
    --accent:#8B84FF;
    --accent-fill:#6C63FF;
    --accent-soft:rgba(139,132,255,.15);
    --accent-ink:#FFFFFF;
    --cool:#5FA8E8;
    --alert:#FF7A7E;
    --alert-soft:rgba(255,122,126,.14);
    --ok:#45C79B;
    --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -10px rgba(0,0,0,.65);
    --shadow-2:0 26px 64px -22px rgba(0,0,0,.82);
    --scrim:rgba(4,6,14,.62);
    --glass:rgba(20,25,48,.78);
    --chart-bar:#2A3252;
    --fill-grad:linear-gradient(180deg,#7C6BFF,#4F7FE0);
    --tile-on-bg:linear-gradient(150deg,#4E42D6,#2F5DB8);
    --tile-on-ink:#FFFFFF;
    --stat-a:linear-gradient(150deg,#22B5AC,#1786B4);
    --stat-b:linear-gradient(150deg,#E8912F,#D2542C);
    --stat-c:linear-gradient(150deg,#E15877,#BE343D);
  }
}

/* ── 5. Âmbar, escuro escolhido no app ───────────────────────── */
:root[data-theme="dark"]{
  --bg:#100E0C;
  --surface:#191614;
  --surface-2:#211D1A;
  --surface-3:#2B2622;
  --line:#332C26;
  --line-soft:#251F1B;
  --text:#F6EFE5;
  --text-dim:#A3968A;
  --text-faint:#6F6459;
  --accent:#F6A93B;
  --accent-fill:#F6A93B;
  --accent-soft:rgba(246,169,59,.13);
  --accent-ink:#2A1B06;
  --cool:#7FB6E8;
  --alert:#E8705A;
  --alert-soft:rgba(232,112,90,.14);
  --ok:#5CB98A;
  --shadow-1:0 1px 2px rgba(0,0,0,.34), 0 6px 18px -10px rgba(0,0,0,.6);
  --shadow-2:0 24px 60px -20px rgba(0,0,0,.8);
  --scrim:rgba(6,5,4,.62);
  --glass:rgba(25,22,20,.76);
  --chart-bar:#3B332B;
  --tile-on-bg:linear-gradient(170deg,#5C3F14,#3C2A0E);
  --tile-on-ink:#FFDFA8;
}

/* ── 6. Aurora, escuro escolhido no app ──────────────────────── */
:root[data-palette="aurora"][data-theme="dark"]{
  --bg:#0B0E1B;
  --surface:#141930;
  --surface-2:#1A2039;
  --surface-3:#222945;
  --line:#2B3355;
  --line-soft:#1E2540;
  --text:#EEF1FA;
  --text-dim:#98A2C0;
  --text-faint:#67718F;
  --accent:#8B84FF;
  --accent-fill:#6C63FF;
  --accent-soft:rgba(139,132,255,.15);
  --accent-ink:#FFFFFF;
  --cool:#5FA8E8;
  --alert:#FF7A7E;
  --alert-soft:rgba(255,122,126,.14);
  --ok:#45C79B;
  --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -10px rgba(0,0,0,.65);
  --shadow-2:0 26px 64px -22px rgba(0,0,0,.82);
  --scrim:rgba(4,6,14,.62);
  --glass:rgba(20,25,48,.78);
  --chart-bar:#2A3252;
  --fill-grad:linear-gradient(180deg,#7C6BFF,#4F7FE0);
  --tile-on-bg:linear-gradient(150deg,#4E42D6,#2F5DB8);
  --tile-on-ink:#FFFFFF;
  --stat-a:linear-gradient(150deg,#22B5AC,#1786B4);
  --stat-b:linear-gradient(150deg,#E8912F,#D2542C);
  --stat-c:linear-gradient(150deg,#E15877,#BE343D);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-ui);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

/* ── Casca do app ─────────────────────────────────────────── */
.shell{
  position:relative;
  display:flex;flex-direction:column;
  height:100dvh;width:100%;
  overflow:hidden;
  background:var(--bg);
  isolation:isolate;
}
/* Em telas largas (desktop, durante o desenvolvimento) o app aparece
   dentro de um aparelho. No iPhone instalado, ocupa a tela inteira. */
@media (min-width:780px) and (min-height:700px){
  body{
    display:grid;place-items:center;min-height:100dvh;
    background:
      radial-gradient(120% 90% at 50% 0%, var(--surface-2), var(--bg) 62%);
    padding:28px;
  }
  .shell{
    width:390px;height:812px;max-height:calc(100dvh - 56px);
    border-radius:46px;
    border:1px solid var(--line);
    box-shadow:var(--shadow-2);
  }
  .deskcap{
    position:fixed;left:0;right:0;bottom:14px;text-align:center;
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);
  }
}
.deskcap{display:none}
@media (min-width:780px) and (min-height:700px){.deskcap{display:block}}

/* ── Cabeçalho ────────────────────────────────────────────── */
.head{
  flex:0 0 auto;
  padding:max(14px,env(safe-area-inset-top)) 20px 10px;
  background:var(--glass);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line-soft);
  z-index:3;
}
.head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.head h1{
  font-family:var(--font-display);
  font-size:27px;font-weight:700;letter-spacing:-.022em;
  margin:0;line-height:1.1;text-wrap:balance;color:var(--text);
}
@supports (background-clip:text) or (-webkit-background-clip:text){
  .head h1{background-image:var(--title-bg);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
}
.eyebrow{
  font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-faint);margin:0 0 3px;
}
.head-btn{
  width:38px;height:38px;flex:0 0 auto;
  display:grid;place-items:center;border-radius:50%;
  background:var(--surface-3);color:var(--text-dim);
}
.head-btn:active{transform:scale(.93)}

/* faixa de status: densa, monoespaçada — legenda de painel */
.statusbar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin-top:9px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.01em;
  color:var(--text-faint);
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:0 0 auto}
.dot.warn{background:var(--alert)}
.dot.idle{background:var(--text-faint)}
.status-sep{opacity:.4}
.chip-demo{
  font-family:var(--font-ui);font-size:9.5px;font-weight:700;letter-spacing:.1em;
  padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent);
}

/* ── Área rolável ─────────────────────────────────────────── */
.view{
  flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 20px calc(28px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:22px;
}
/* Sem isto, num flex column de altura fixa os blocos se espremem em vez
   de transbordar — o painel de leituras vira uma linha de 1px. */
.view>*{flex:0 0 auto}
.section{display:flex;flex-direction:column;gap:11px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.section-head h2{
  font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:var(--text-faint);margin:0;
}
.section-head .aux{font-size:12px;color:var(--text-faint);font-variant-numeric:tabular-nums}

/* ── Painel "agora": leituras grandes e finas ─────────────── */
.readouts{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--readout-gap);
  background:var(--readout-bg);border-radius:var(--r-lg);border:var(--readout-border)}
.readout{padding:14px 12px 13px;display:flex;flex-direction:column;gap:2px;
  border-radius:var(--readout-r);overflow:hidden;color:var(--stat-ink)}
.readout:nth-child(1){background:var(--stat-a)}
.readout:nth-child(2){background:var(--stat-b)}
.readout:nth-child(3){background:var(--stat-c)}
.readout .k{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--stat-key)}
.readout .v{
  font-family:var(--font-display);
  font-size:29px;font-weight:200;letter-spacing:-.03em;line-height:1.1;
  font-variant-numeric:tabular-nums;
}
.readout .v u{font-size:13px;font-weight:500;text-decoration:none;opacity:.72;margin-left:2px;letter-spacing:0}

/* ── Cenas ────────────────────────────────────────────────── */
.scenerow{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px 4px}
.scenerow::-webkit-scrollbar{display:none}
.scene{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:9px 15px 9px 11px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);
  font-size:14px;font-weight:500;white-space:nowrap;
  transition:transform .16s var(--ease),background .16s;
}
.scene:active{transform:scale(.95)}
.scene svg{width:18px;height:18px;color:var(--text-dim)}
.scene.hot{background:var(--accent-fill);border-color:transparent;color:var(--accent-ink)}
.scene.hot svg{color:var(--accent-ink)}

/* ── Grade de dispositivos favoritos ──────────────────────── */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{
  position:relative;text-align:left;
  padding:13px 14px 12px;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);
  display:flex;flex-direction:column;gap:14px;min-height:104px;
  transition:transform .16s var(--ease);
}
.tile:active{transform:scale(.975)}
.tile.on{background:var(--tile-on-bg);border-color:transparent;color:var(--tile-on-ink)}
.tile.off-net{opacity:.55}
.tile-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.tile-ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  background:var(--surface-3);color:var(--text-dim);flex:0 0 auto}
.tile.on .tile-ico{background:rgba(255,255,255,.28);color:var(--tile-on-ink)}
.tile-ico svg{width:19px;height:19px}
.tile-name{font-size:14.5px;font-weight:600;letter-spacing:-.01em;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile-sub{font-size:11.5px;color:var(--text-faint);margin-top:1px;font-variant-numeric:tabular-nums}
.tile.on .tile-sub{color:var(--tile-on-ink);opacity:.72}
.tile-more{
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  color:var(--text-faint);margin:-3px -4px 0 0;flex:0 0 auto;
}
.tile.on .tile-more{color:var(--tile-on-ink);opacity:.6}
.tile-more svg{width:15px;height:15px}

/* pulso de "aguardando confirmação do rádio" */
.pending::after{
  content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;
  border:1.5px solid var(--accent-fill);animation:breathe 1.1s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.15}50%{opacity:.85}}
.rejected{animation:nudge .34s ease}
@keyframes nudge{0%,100%{transform:translateX(0)}22%{transform:translateX(-5px)}62%{transform:translateX(4px)}}

/* ── Linhas de dispositivo ────────────────────────────────── */
.list{display:flex;flex-direction:column;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;width:100%;
  border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:0}
.row:active{background:var(--surface-2)}
.row-ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  background:var(--surface-3);color:var(--text-dim);flex:0 0 auto}
.row-ico.lit{background:var(--accent-soft);color:var(--accent)}
.row-ico svg{width:18px;height:18px}
.row-main{flex:1 1 auto;min-width:0}
.row-name{display:block;font-size:15px;font-weight:500;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{display:block;font-size:12px;color:var(--text-faint);font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-aux{flex:0 0 auto;display:flex;align-items:center;gap:10px;color:var(--text-faint)}
.row-aux svg{width:16px;height:16px}
/* Etiqueta curta: a descrição da rotina usa ellipsis, então um sufixo de
   texto seria cortado justamente onde explica o esmaecimento. */
.dorme{display:inline-block;margin-left:7px;padding:1px 7px;border-radius:6px;
  background:var(--surface-3);color:var(--text-faint);font-size:9.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;font-style:normal;vertical-align:1.5px}
.row-val{font-family:var(--font-display);font-size:17px;font-weight:300;
  font-variant-numeric:tabular-nums;color:var(--text-dim)}

/* interruptor */
.sw{width:47px;height:29px;border-radius:999px;background:var(--surface-3);
  position:relative;flex:0 0 auto;transition:background .2s var(--ease)}
.sw::after{content:"";position:absolute;top:2.5px;left:2.5px;width:24px;height:24px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.28);transition:transform .22s var(--ease)}
.sw.on{background:var(--accent-fill)}
.sw.on::after{transform:translateX(18px)}

/* ── Pílulas de cômodo ────────────────────────────────────── */
.pills{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px 4px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:500;
  background:var(--surface);border:1px solid var(--line);color:var(--text-dim);white-space:nowrap}
.pill[aria-selected="true"]{background:var(--pill-on-bg);color:var(--pill-on-ink);border-color:transparent}

/* ── Barra de abas ────────────────────────────────────────── */
.tabs{
  flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);
  padding:7px 8px max(7px,env(safe-area-inset-bottom));
  background:var(--glass);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line-soft);z-index:3;
}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0 3px;
  color:var(--text-faint);font-size:10px;font-weight:500;letter-spacing:.01em}
.tab svg{width:23px;height:23px}
.tab[aria-selected="true"]{color:var(--accent)}

/* ── Sheet do dispositivo ─────────────────────────────────── */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:8;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);animation:fade .26s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:9;
  max-height:92%;display:flex;flex-direction:column;
  background:var(--surface);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  border-top:1px solid var(--line);
  box-shadow:var(--shadow-2);
  animation:rise .34s var(--ease);
  overflow:hidden;
  --bloom-c:var(--bloom-default);
}
@media (min-width:780px) and (min-height:700px){.sheet{border-radius:var(--r-xl) var(--r-xl) 44px 44px}}
@keyframes rise{from{transform:translateY(102%)}to{transform:translateY(0)}}
/* Re-render com o MESMO sheet aberto (chegou um delta, mexeu num slider):
   o nó é reconstruído, mas não pode PARECER que reabriu — nada de repetir
   a subida nem o fade do scrim. O toast fica de fora de propósito: cada
   toast é novo de verdade e merece a entrada. */
#layer.sem-anim .sheet,#layer.sem-anim .scrim{animation:none}
/* O "bloom": a luz que o cômodo vai receber, antes de o rádio responder.
   Centrado sobre o slider — é de lá que a luz sai. Fica todo dentro da
   caixa para não deixar a borda do degradê aparecer como emenda. */
.sheet::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(46% 32% at 22% 30%, var(--bloom-c) 0%, transparent 70%);
  opacity:var(--bloom-a,0);transition:opacity .3s var(--ease),background .3s var(--ease);
}
.sheet-in{position:relative;overflow-y:auto;padding:8px 22px calc(26px + env(safe-area-inset-bottom))}
.grab{width:38px;height:4.5px;border-radius:999px;background:var(--line);margin:0 auto 12px}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:20px}
.sheet-head h2{font-family:var(--font-display);font-size:24px;font-weight:600;letter-spacing:-.022em;margin:0;line-height:1.2}
.sheet-head .where{font-size:12.5px;color:var(--text-faint);margin-top:2px}

/* slider vertical — o elemento de assinatura */
.control{display:flex;gap:16px;align-items:stretch;margin-bottom:20px}
.vslider{
  --vh:226px;                     /* altura interna: 228px menos as bordas */
  position:relative;flex:0 0 116px;height:228px;border-radius:26px;overflow:hidden;
  background:var(--surface-3);touch-action:none;user-select:none;-webkit-user-select:none;
  border:1px solid var(--line);
}
.vfill{position:absolute;left:0;right:0;bottom:0;overflow:hidden;
  background:var(--fill-grad);
  transition:height .18s var(--ease)}
.vslider.dragging .vfill{transition:none}
/* O número e o ícone são desenhados duas vezes: a cópia clara embaixo e a
   cópia escura dentro do preenchimento, que a recorta. Assim a leitura
   troca de cor exatamente na linha da luz, sem meio-termo ilegível quando
   o brilho para no meio do algarismo. */
.vfill-clip{position:absolute;left:0;right:0;bottom:0;height:var(--vh);pointer-events:none}
.vslider-txt{position:absolute;left:0;right:0;bottom:16px;text-align:center;
  font-family:var(--font-display);font-size:34px;font-weight:250;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;color:var(--text-dim)}
.vslider-txt u{font-size:15px;font-weight:500;text-decoration:none;opacity:.6}
.vslider-ico{position:absolute;top:16px;left:0;right:0;display:grid;place-items:center;
  color:var(--text-faint)}
.vslider-ico svg{width:22px;height:22px}
.vfill .vslider-txt{color:var(--accent-ink)}
.vfill .vslider-ico{color:var(--accent-ink);opacity:.6}
.control-side{flex:1 1 auto;display:flex;flex-direction:column;gap:10px}
.bigbtn{flex:1 1 0;border-radius:20px;background:var(--surface-2);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  font-size:12.5px;font-weight:600;color:var(--text-dim);padding:10px}
.bigbtn svg{width:22px;height:22px}
.bigbtn[aria-pressed="true"]{background:var(--accent-fill);border-color:transparent;color:var(--accent-ink)}
.bigbtn:active{transform:scale(.97)}
/* O âmbar quer dizer uma coisa só: "está aceso". Preferido é uma
   preferência, não um estado do circuito — fica em voz baixa. */
.bigbtn.quiet[aria-pressed="true"]{background:var(--surface-2);border-color:var(--line);color:var(--text)}
.bigbtn.quiet[aria-pressed="true"] svg{color:var(--accent)}

/* faixa de temperatura de cor: o eixo âmbar↔azul é dado, não enfeite */
.cct{margin-bottom:20px}
.cct-track{position:relative;height:52px;border-radius:16px;touch-action:none;
  background:linear-gradient(90deg,#FF9E3D,#FFD2A1,#FFF3E4,#E4EEFB,#C9DEFA);
  border:1px solid var(--line);cursor:pointer}
.cct-knob{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35),0 0 0 1.5px rgba(0,0,0,.07);pointer-events:none}
.cct-scale{display:flex;justify-content:space-between;margin-top:6px;
  font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}

/* ficha técnica */
.specs{border-top:1px solid var(--line-soft);padding-top:4px}
.spec{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.spec:last-child{border-bottom:0}
.spec .k{color:var(--text-faint);flex:0 0 auto}
.spec .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--text-dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spec .v.mono{font-family:var(--font-mono);font-size:12px}
.bars{display:inline-flex;align-items:flex-end;gap:2px;height:13px;vertical-align:-2px;margin-right:6px}
.bars i{width:3px;border-radius:1px;background:var(--line);display:block}
.bars i.f{background:var(--ok)}
.bars.weak i.f{background:var(--alert)}

/* ── Gráfico de energia ───────────────────────────────────── */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 14px 12px}
.chart-top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px;padding:0 4px}
.chart-big{font-family:var(--font-display);font-size:38px;font-weight:200;letter-spacing:-.035em;
  line-height:1;font-variant-numeric:tabular-nums}
.chart-big u{font-size:15px;font-weight:500;text-decoration:none;color:var(--text-dim);margin-left:3px;letter-spacing:0}
.chart-note{font-size:12px;color:var(--text-faint);text-align:right;line-height:1.35}
.chart svg{display:block;width:100%;height:118px;overflow:visible}
.chart-axis{display:flex;justify-content:space-between;padding:7px 4px 0;
  font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}

/* ── Avisos / banners ─────────────────────────────────────── */
.banner{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:var(--r-md);
  background:var(--alert-soft);color:var(--alert);font-size:13px;font-weight:500;line-height:1.35}
.banner svg{width:19px;height:19px;flex:0 0 auto}
.banner.calm{background:var(--surface-2);color:var(--text-dim);border:1px solid var(--line)}

.toast{
  position:absolute;left:16px;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:20;
  background:var(--text);color:var(--bg);padding:12px 15px;border-radius:14px;font-size:13.5px;
  font-weight:500;box-shadow:var(--shadow-2);animation:pop .3s var(--ease);
  display:flex;align-items:center;gap:10px;line-height:1.35;
}
.toast svg{width:18px;height:18px;flex:0 0 auto;opacity:.7}
@keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ── Tela de bloqueio ─────────────────────────────────────── */
.lock{position:absolute;inset:0;z-index:30;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:26px;padding:32px 30px calc(38px + env(safe-area-inset-bottom))}
.lock-mark{width:60px;height:60px;border-radius:19px;display:grid;place-items:center;
  background:var(--accent-fill);color:var(--accent-ink)}
.lock-mark svg{width:31px;height:31px}
.lock h2{font-family:var(--font-display);font-size:21px;font-weight:600;letter-spacing:-.02em;margin:0;text-align:center}
.lock p{margin:-16px 0 0;font-size:13px;color:var(--text-faint);text-align:center}
.pips{display:flex;gap:13px;margin:2px 0 4px}
.pips i{width:12px;height:12px;border-radius:50%;background:var(--surface-3);
  border:1px solid var(--line);transition:background .18s,transform .18s var(--ease)}
.pips i.f{background:var(--accent-fill);border-color:transparent;transform:scale(1.1)}
.pips.bad{animation:nudge .36s ease}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.key{height:72px;border-radius:50%;background:var(--surface);border:1px solid var(--line);
  font-family:var(--font-display);font-size:27px;font-weight:300;display:grid;place-items:center}
.key:active{background:var(--surface-3);transform:scale(.94)}
.key.blank{background:none;border:0}
.key.fn{font-size:13px;font-weight:600;color:var(--text-dim);background:none;border:0}

/* ── Capabilities no sheet ────────────────────────────────── */
/* Um device tem N funções. Cada uma se desenha sozinha, e função de tipo
   desconhecido simplesmente não aparece — o resto do aparelho continua
   inteiro. É o §2.3 do contrato virando CSS e nada mais. */
.cap{display:flex;flex-direction:column;gap:9px;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.cap:last-of-type{border-bottom:0}
.cap-topo{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.cap-nome{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint)}
.cap-val{font-family:var(--font-display);font-size:15px;font-weight:400;
  font-variant-numeric:tabular-nums;color:var(--text-dim)}

/* Matiz: o espectro é o dado, igual à faixa de temperatura de cor. */
.hue-track{position:relative;height:44px;border-radius:14px;touch-action:none;cursor:pointer;
  border:1px solid var(--line);background:linear-gradient(90deg,
    #FF4D4D,#FFD24D,#4DFF64,#4DFFE8,#4D7CFF,#B84DFF,#FF4D9E,#FF4D4D)}
.hue-knob{position:absolute;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35),0 0 0 1.5px rgba(0,0,0,.07);pointer-events:none}

/* Termostato */
.termo{display:flex;align-items:center;justify-content:space-between;gap:14px}
.termo-alvo{font-family:var(--font-display);font-size:46px;font-weight:200;letter-spacing:-.035em;
  line-height:1;font-variant-numeric:tabular-nums}
.termo-alvo u{font-size:18px;font-weight:400;text-decoration:none;color:var(--text-dim)}
.termo-btn{width:46px;height:46px;border-radius:50%;background:var(--surface-3);
  display:grid;place-items:center;font-size:22px;font-weight:300;color:var(--text)}
.termo-btn:active{transform:scale(.92)}
.modos-linha{display:flex;gap:6px;flex-wrap:wrap}
.modo-chip{padding:7px 13px;border-radius:999px;font-size:13px;font-weight:500;
  background:var(--surface-2);border:1px solid var(--line);color:var(--text-dim)}
.modo-chip[aria-pressed="true"]{background:var(--accent-fill);border-color:transparent;color:var(--accent-ink)}

/* Canais de um multi-teclas */
.canais{display:flex;flex-direction:column;gap:8px}
.canal{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 13px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.canal-nome{font-size:14.5px;font-weight:500}

/* Estado de sensor binário */
.chip-estado{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  font-size:12px;font-weight:600;background:var(--surface-3);color:var(--text-dim)}
.chip-estado.ativo{background:var(--alert-soft);color:var(--alert)}

/* ── Entrada (login e primeira configuração) ──────────────── */
.entrada{position:absolute;inset:0;z-index:30;background:var(--bg);overflow-y:auto;
  display:flex;flex-direction:column;justify-content:center;gap:20px;
  padding:32px 28px calc(38px + env(safe-area-inset-bottom))}
.entrada h2{font-family:var(--font-display);font-size:24px;font-weight:600;
  letter-spacing:-.02em;margin:0;text-align:center;text-wrap:balance}
.entrada p.sub{margin:-12px 0 0;font-size:13.5px;color:var(--text-faint);
  text-align:center;line-height:1.45;text-wrap:pretty}
.marca{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;margin:0 auto;
  background:var(--accent-fill);color:var(--accent-ink)}
.marca svg{width:29px;height:29px}
.form{display:flex;flex-direction:column;gap:10px}
.campo{width:100%;padding:14px 15px;border-radius:14px;font-size:16px;
  background:var(--surface);border:1px solid var(--line);color:var(--text);
  font-family:inherit;-webkit-appearance:none}
.campo::placeholder{color:var(--text-faint)}
.campo:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.botao{width:100%;padding:15px;border-radius:14px;font-size:16px;font-weight:600;
  background:var(--accent-fill);color:var(--accent-ink);text-align:center}
.botao:active{transform:scale(.985)}
.botao.fraco{background:var(--surface-2);border:1px solid var(--line);color:var(--text-dim);font-weight:500}
.erro-form{font-size:13px;color:var(--alert);text-align:center;line-height:1.4}
.aviso-mini{font-size:11.5px;color:var(--text-faint);text-align:center;line-height:1.5}

/* ── Modo da casa ─────────────────────────────────────────── */
/* O modo é o que faz uma rotina deixar de ser "se X então Y": o mesmo
   gatilho age diferente conforme o estado em que a casa está. */
.modos{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.modo{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px 9px;
  border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);
  font-size:11px;font-weight:500;color:var(--text-dim);transition:transform .16s var(--ease)}
.modo svg{width:19px;height:19px}
.modo:active{transform:scale(.95)}
.modo[aria-selected="true"]{background:var(--accent-fill);border-color:transparent;color:var(--accent-ink)}

/* ── Sugestão da casa ─────────────────────────────────────── */
/* Tratamento próprio de propósito: não é mais um controle, é a casa
   falando. Traz a observação, o recibo em monoespaçado e a letra miúda
   do que exatamente vai passar a acontecer. */
.sug{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--r-lg);
  background:var(--accent-soft);border:1px solid var(--accent-soft)}
.sug.recuo{background:var(--alert-soft);border-color:var(--alert-soft)}
.sug-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sug-tag{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;
  letter-spacing:.11em;text-transform:uppercase;color:var(--accent)}
.sug.recuo .sug-tag{color:var(--alert)}
.sug-tag svg{width:14px;height:14px}
.sug-conf{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);
  font-size:10.5px;color:var(--text-faint)}
.sug-bar{width:34px;height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.sug-bar i{display:block;height:100%;background:var(--accent)}
.sug.recuo .sug-bar i{background:var(--alert)}
.sug-txt{margin:0;font-family:var(--font-display);font-size:17px;font-weight:400;
  line-height:1.35;letter-spacing:-.012em;text-wrap:pretty}
.sug-ev{margin:-6px 0 0;font-family:var(--font-mono);font-size:11px;color:var(--text-faint)}
.sug-acao{display:flex;gap:9px;padding:11px 12px;border-radius:var(--r-md);
  background:var(--surface);border:1px solid var(--line);font-size:13px;
  color:var(--text-dim);line-height:1.4}
.sug-acao svg{width:16px;height:16px;flex:0 0 auto;margin-top:1px;color:var(--text-faint)}
.sug-btns{display:flex;gap:7px}
.sug-b{flex:1 1 auto;padding:10px 6px;border-radius:12px;font-size:13px;font-weight:500;
  background:var(--surface);border:1px solid var(--line);color:var(--text-dim)}
.sug-b.sim{flex:1.5 1 auto;background:var(--accent-fill);border-color:transparent;
  color:var(--accent-ink);font-weight:600}
.sug.recuo .sug-b.sim{background:var(--alert);color:#fff}
.sug-b:active{transform:scale(.97)}

/* ── Seletor de paleta ────────────────────────────────────── */
.swatches{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatch{display:flex;flex-direction:column;gap:10px;padding:13px;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--line);text-align:left}
.swatch[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.swatch-cores{display:flex;gap:5px}
.swatch-cores i{width:26px;height:26px;border-radius:9px;display:block;
  box-shadow:inset 0 0 0 1px rgba(128,128,128,.18)}
.swatch-nome{font-size:14px;font-weight:600}

.empty{text-align:center;color:var(--text-faint);font-size:13.5px;padding:26px 10px;line-height:1.5}
.sronly{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>

<p class="deskcap">Nexo &middot; pré-visualização do painel &middot; arraste o brilho no cartão do dispositivo</p>

<script>
(function(){
"use strict";

/* ═══════════════════════════════════════════════════════════════
   NEXO — cliente do contrato v1
   Servido pela central. Não conhece Zigbee, Home Assistant, mireds
   nem 0–254: fala capabilities em unidade de exibição, e só.

   A regra que estrutura o arquivo inteiro: a tela é montada a partir
   das capabilities que a central declara. Não há "se for lâmpada".
   Capability de tipo desconhecido é ignorada em silêncio (§2.3), e
   é por isso que aparelho novo não exige publicar app.
   ═══════════════════════════════════════════════════════════════ */

const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> [...(r||document).querySelectorAll(s)];
const el = (id)=> document.getElementById(id);
const clamp = (n,a,b)=> n<a?a:n>b?b:n;
const esc = (s)=> String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf  = (n,d)=> Number.isFinite(n)
  ? n.toLocaleString('pt-BR',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}) : '—';

/* O Safari em navegação privada lança ao tocar em localStorage. */
const guarda = {
  ler(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } },
  gravar(k,v){ try{ localStorage.setItem(k,v); }catch(_){ } },
  apagar(k){ try{ localStorage.removeItem(k); }catch(_){ } }
};

/* ── Estado ─────────────────────────────────────────────────── */
const S = {
  tela:'carregando',        // carregando | claim | login | app
  view:'home', area:null, sheet:null,
  conn:'off', demo:false, erroForm:null, ocupado:false,
  theme:   guarda.ler('nexo.theme')   || 'auto',
  palette: guarda.ler('nexo.palette') || 'ambar',
  home:{ id:null, name:'Casa', areas:[] },
  devices:[], scenes:[], modes:{ current:'normal', available:[] },
  automations:[], suggestions:[], usuarios:[], convite:null, series:{}, toast:null
};

const dev  = id => S.devices.find(d=>d.id===id);
const area = id => S.home.areas.find(a=>a.id===id);
const nomeArea = id => area(id)?.name || 'Sem cômodo';
const caps = (d,t) => d.capabilities.filter(c=>c.type===t);
const cap1 = (d,t) => d.capabilities.find(c=>c.type===t) || null;

/** O papel vem do claim do access token. Decodificar aqui é só para
 *  ESCONDER seções que o servidor negaria de qualquer jeito — a
 *  autorização de verdade continua sendo do servidor. */
function papelAtual(){
  if (S.demo) return 'owner';
  try{
    const p = API.acc.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    return JSON.parse(atob(p + '='.repeat((4 - p.length % 4) % 4))).role || 'member';
  }catch(_){ return 'member'; }
}

/* ═══════════════════════════════════════════════════════════════
   CLIENTE DA API
   ═══════════════════════════════════════════════════════════════ */
const API = {
  base:'/api/v1',
  acc: guarda.ler('nexo.acc'),
  ref: guarda.ler('nexo.ref'),

  guardar(par){
    this.acc = par.accessToken; this.ref = par.refreshToken;
    guarda.gravar('nexo.acc', this.acc); guarda.gravar('nexo.ref', this.ref);
  },
  limpar(){
    this.acc = this.ref = null;
    guarda.apagar('nexo.acc'); guarda.apagar('nexo.ref');
  },

  async req(metodo, caminho, corpo, jaTentou){
    if (S.demo) return Demo.req(metodo, caminho, corpo);

    const r = await fetch(this.base + caminho, {
      method: metodo,
      headers: { ...(corpo ? {'content-type':'application/json'} : {}),
                 ...(this.acc ? {authorization:'Bearer ' + this.acc} : {}) },
      body: corpo ? JSON.stringify(corpo) : undefined
    });

    // Access token dura 15 min. Renova uma vez, em silêncio; se o refresh
    // também morreu, aí sim volta para a tela de entrada.
    if (r.status === 401 && this.ref && !jaTentou) {
      if (await this.renovar()) return this.req(metodo, caminho, corpo, true);
      this.limpar(); S.tela = 'login'; render();
      throw Object.assign(new Error('unauthorized'), { status:401 });
    }

    const texto = await r.text();
    const dados = texto ? JSON.parse(texto) : null;
    // O cliente ramifica por `error`, que é estável; `message` é só para
    // mostrar (§7).
    if (!r.ok) throw Object.assign(new Error(dados?.message || 'Falha na central.'),
                                   { status:r.status, error:dados?.error });
    return dados;
  },

  async renovar(){
    try{
      const r = await fetch(this.base + '/auth/refresh', {
        method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({ refreshToken: this.ref })
      });
      if (!r.ok) return false;
      this.guardar(await r.json());
      return true;
    }catch(_){ return false; }
  }
};

/* ═══════════════════════════════════════════════════════════════
   STREAM
   ═══════════════════════════════════════════════════════════════ */
const Stream = {
  ws:null, backoff:800, ultimaSeq:0,

  abrir(){
    if (S.demo) return Demo.assinar(m=>this.receber(m));
    const proto = location.protocol==='https:' ? 'wss' : 'ws';
    const ws = this.ws = new WebSocket(`${proto}://${location.host}/api/v1/stream`);

    // Header customizado não existe no handshake de WebSocket do
    // navegador: a autenticação vai na primeira mensagem (§6.1).
    ws.onopen = ()=> ws.send(JSON.stringify({ type:'auth', token: API.acc }));

    ws.onmessage = e=>{ try{ this.receber(JSON.parse(e.data)); }catch(_){ } };

    ws.onclose = ev=>{
      S.conn = 'off'; render();
      if (ev.code === 4401){       // token venceu enquanto o socket vivia
        API.renovar().then(ok => ok ? this.abrir() : (API.limpar(), S.tela='login', render()));
        return;
      }
      setTimeout(()=>this.abrir(), this.backoff);
      this.backoff = Math.min(this.backoff*2, 15000);
    };
  },

  async receber(m){
    if (m.type === 'auth.ok'){
      S.conn = 'on'; this.backoff = 800;
      // §6.4: ao reconectar, descarta o local e refaz o GET. Buffer por
      // conexão custaria memória na central para poupar um GET barato.
      await carregarTudo();
      return render();
    }

    // seq só existe para perceber buraco. Percebeu, refaz o GET.
    if (m.seq !== undefined){
      if (this.ultimaSeq && m.seq > this.ultimaSeq + 1) carregarDevices();
      this.ultimaSeq = m.seq;
    }

    const p = m.payload || {};
    switch (m.type){
      case 'state.changed': {
        const d = dev(p.deviceId); if(!d) break;
        const c = d.capabilities.find(x=>x.id===p.capabilityId); if(!c) break;
        Object.assign(c, p.changes);      // delta parcial, nunca o device todo
        break;
      }
      case 'device.reachability': {
        const d = dev(p.deviceId); if(d) d.reachability = p.reachability; break;
      }
      case 'device.event': {
        const d = dev(p.deviceId); if(!d) break;
        const c = d.capabilities.find(x=>x.id===p.capabilityId);
        if (c){ c.lastEvent = p.event; c.lastEventAt = m.ts; }
        aviso(`${d.name}: ${rotuloEvento(p.event)}`, 'ic-scene');
        break;
      }
      case 'device.added':
        if (!dev(p.device.id)) S.devices.push(p.device);
        aviso(`"${p.device.name}" entrou na rede.`, 'ic-plus');
        break;
      case 'device.removed':
        S.devices = S.devices.filter(d=>d.id!==p.deviceId);
        if (S.sheet === p.deviceId) S.sheet = null;
        break;
      case 'command.result':   resolverComando(p); break;
      case 'mode.changed':     S.modes.current = p.mode; break;
      case 'suggestions.changed': S.suggestions = p.suggestions; break;
      case 'automation.changed':  carregarExtensoes(); break;
      default: break;          // tipo de evento novo: ignora, não quebra
    }
    render();
  }
};

/* ═══════════════════════════════════════════════════════════════
   COMANDOS — otimista, reconciliado por command.result
   ═══════════════════════════════════════════════════════════════ */
const emVoo = new Map();     // commandId → { deviceId, capId, antes, prazo }

async function comandar(deviceId, capId, comando){
  const d = dev(deviceId); if(!d) return;
  const c = d.capabilities.find(x=>x.id===capId); if(!c) return;

  // A central responde 202: aceito e despachado. A confirmação chega
  // depois, pelo stream. Esperar por ela para mexer na tela faria o app
  // parecer travado — o rádio leva de 100 a 500 ms, e mais se o nó
  // estiver longe. Então muda já e reconcilia.
  const antes = { ...c };
  Object.assign(c, previsao(c, comando));
  c._pend = true;
  render();

  try{
    const r = await API.req('POST',
      `/devices/${deviceId}/capabilities/${encodeURIComponent(capId)}/command`, comando);
    emVoo.set(r.commandId, { deviceId, capId, antes, prazo: Date.now()+8000 });
  }catch(e){
    Object.assign(c, antes); delete c._pend;
    aviso(mensagemDeErro(e, d), 'ic-alert');
    render();
  }
}

/** O que o comando deve produzir na capability, para a tela mostrar já. */
function previsao(c, cmd){
  switch(cmd.type){
    case 'switch':     return { state: cmd.toggle ? !c.state : cmd.state };
    case 'dimmer':     return { value: cmd.value };
    case 'color_temp': return { kelvin: cmd.kelvin };
    case 'color':      return { hue: cmd.hue, saturation: cmd.saturation };
    case 'cover':      return cmd.action
      ? { moving: cmd.action==='open' ? 'opening' : cmd.action==='close' ? 'closing' : 'stopped' }
      : { position: cmd.position };
    case 'lock':       return { state: cmd.state };
    case 'thermostat': return { ...(cmd.targetTemp!==undefined?{targetTemp:cmd.targetTemp}:{}),
                                ...(cmd.mode!==undefined?{mode:cmd.mode}:{}) };
    default: return {};
  }
}

function resolverComando(p){
  const v = emVoo.get(p.commandId); if(!v) return;
  emVoo.delete(p.commandId);
  const d = dev(v.deviceId); if(!d) return;
  const c = d.capabilities.find(x=>x.id===v.capId); if(!c) return;
  delete c._pend;

  if (p.status === 'failed'){
    Object.assign(c, v.antes);
    c._falhou = true;
    setTimeout(()=>{ delete c._falhou; render(); }, 420);
    aviso(`"${d.name}" não respondeu. Sinal fraco na malha.`, 'ic-alert');
  }
}

/* Rede que engoliu o command.result deixaria a tela pulsando para sempre. */
setInterval(()=>{
  const t = Date.now(); let mexeu = false;
  for (const [id,v] of emVoo){
    if (v.prazo > t) continue;
    emVoo.delete(id);
    const c = dev(v.deviceId)?.capabilities.find(x=>x.id===v.capId);
    if (c){ delete c._pend; mexeu = true; }
  }
  if (mexeu) render();
}, 2000);

const mensagemDeErro = (e, d) => ({
  device_offline: `${d.name} está fora do ar.`,
  forbidden: 'Seu perfil não permite controlar este dispositivo.',
  capability_readonly: 'Esta função é só leitura.'
}[e.error] || e.message || 'Não consegui falar com a central.');

/* ═══════════════════════════════════════════════════════════════
   RENDERIZADORES POR CAPABILITY
   Cada entrada sabe se desenhar. Tipo ausente daqui não aparece na
   tela e não derruba nada — que é exatamente o que o §2.3 exige.
   ═══════════════════════════════════════════════════════════════ */
const REND = {
  switch: {
    peso: 10,
    resumo: c => c.state ? 'Ligado' : 'Desligado',
    aceso:  c => c.state,
    atalho: (d,c) => `<span class="sw${c.state?' on':''}" data-act="toggle"
      data-d="${d.id}" data-c="${esc(c.id)}" role="switch" aria-checked="${c.state}"></span>`,
    controle: (d,c) => `<button class="bigbtn" data-act="toggle" data-d="${d.id}"
      data-c="${esc(c.id)}" aria-pressed="${c.state}">
      <svg><use href="#${iconeDe(d)}"/></svg>${c.label ? esc(c.label)+' · ' : ''}${c.state?'Ligado':'Desligado'}
    </button>`
  },

  dimmer: {
    peso: 9,
    resumo: c => `${c.value}%`,
    aceso:  c => c.value > 0,
    controle: (d,c) => colunaVertical(c, d, 'Brilho', '%')
  },

  color_temp: {
    peso: 5,
    resumo: c => `${c.kelvin}K`,
    controle: (d,c) => `
      <div class="cap">
        <div class="cap-topo"><span class="cap-nome">Temperatura de cor</span>
          <span class="cap-val" id="ct-val">${c.kelvin}K</span></div>
        <div class="cct-track" id="ct" data-d="${d.id}" data-c="${esc(c.id)}"
             data-min="${c.minKelvin}" data-max="${c.maxKelvin}"
             role="slider" tabindex="0" aria-label="Temperatura de cor"
             aria-valuemin="${c.minKelvin}" aria-valuemax="${c.maxKelvin}"
             aria-valuenow="${c.kelvin}" aria-valuetext="${c.kelvin} kelvin">
          <span class="cct-knob" id="ct-knob"
                style="left:${pctEntre(c.kelvin,c.minKelvin,c.maxKelvin)}%"></span>
        </div>
        <div class="cct-scale"><span>${c.minKelvin}K quente</span><span>${c.maxKelvin}K frio</span></div>
      </div>`
  },

  color: {
    peso: 4,
    resumo: c => c.saturation < 8 ? 'branco' : `matiz ${c.hue}°`,
    controle: (d,c) => `
      <div class="cap">
        <div class="cap-topo"><span class="cap-nome">Cor</span>
          <span class="cap-val" id="hue-val">${c.hue}° · ${c.saturation}%</span></div>
        <div class="hue-track" id="hue" data-d="${d.id}" data-c="${esc(c.id)}"

          <span class="hue-knob" id="hue-knob" style="left:${(c.hue/360*100).toFixed(1)}%"></span>
        </div>

    resumo: c => c.moving==='opening' ? 'Abrindo…' : c.moving==='closing' ? 'Fechando…'

    aceso: c => c.position > 0,
    controle: (d,c) => `
      <div class="control">

        <div class="control-side">

            <svg><use href="#ic-x"/></svg>Parar</button>
          <button class="bigbtn" data-act="cover" data-d="${d.id}" data-c="${esc(c.id)}" data-v="close">
            <svg><use href="#ic-moon"/></svg>Fechar</button>
        </div>
      </div>`
  },

  lock: {
    peso: 10,
    resumo: c => ({locked:'Trancada', unlocked:'Destrancada',

    aceso: c => c.state === 'locked',
    atalho: (d,c) => `<span class="sw${c.state==='locked'?' on':''}" data-act="toggle"

    controle: (d,c) => `<button class="bigbtn" style="flex:1;min-height:130px"

      <svg style="width:30px;height:30px"><use href="#ic-lock"/></svg>

  },

  thermostat: {
    peso: 9,
    resumo: c => `${nf(c.currentTemp,1)}°C · alvo ${nf(c.targetTemp,1)}°`,
    aceso: c => c.mode !== 'off',
    controle: (d,c) => `
      <div class="cap">
        <div class="cap-topo"><span class="cap-nome">Temperatura</span>

                  data-v="${m}" aria-pressed="${c.mode===m}">${

  sensor: {
    peso: 2,
    resumo: c => `${nf(c.value, c.precision)} ${c.unit}`,
    controle: (d,c) => `
      <div class="cap">
        <div class="cap-topo"><span class="cap-nome">${rotuloMedida(c.measure)}</span></div>

                    letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums">

            text-decoration:none;color:var(--text-dim);margin-left:4px">${esc(c.unit)}</u></div>
      </div>`
  },

  binary_sensor: {
    peso: 3,
    resumo: c => textoBinario(c.measure, c.state),
    aceso: c => c.state,
    controle: (d,c) => `
      <div class="cap">
        <div class="cap-topo"><span class="cap-nome">${rotuloMedida(c.measure)}</span>
          <span class="chip-estado${c.state?' ativo':''}">${textoBinario(c.measure, c.state)}</span></div>
      </div>`
  },

  event: {
    peso: 1,
    resumo: c => c.lastEvent ? rotuloEvento(c.lastEvent) : 'Nenhum toque ainda',
    controle: (d,c) => `
      <div class="cap">
        <div class="cap-topo"><span class="cap-nome">Botão</span>
          <span class="cap-val">${c.lastEvent ? esc(rotuloEvento(c.lastEvent)) : '—'}</span></div>
        <div style="font-size:12.5px;color:var(--text-faint);line-height:1.45">
          ${c.supportedEvents.length
            ? 'Reconhece: ' + c.supportedEvents.map(e=>esc(rotuloEvento(e))).join(', ') + '.'
            : ''}

      </div>`
  }
};

const rotuloMedida = m => ({
  temperature:'Temperatura', humidity:'Umidade', illuminance:'Luminosidade',
  pressure:'Pressão', co2:'CO₂', voc:'COV', pm25:'Partículas 2,5',
  power:'Potência', energy:'Energia', voltage:'Tensão', current:'Corrente',
  contact:'Abertura', occupancy:'Presença', motion:'Movimento',
  water_leak:'Vazamento', smoke:'Fumaça', gas:'Gás',
  vibration:'Vibração', tamper:'Violação'
}[m] || m);

const textoBinario = (m, on) => ({
  contact:    on ? 'Aberta' : 'Fechada',
  occupancy:  on ? 'Alguém aí' : 'Vazio',
  motion:     on ? 'Movimento' : 'Parado',
  water_leak: on ? 'Água detectada' : 'Seco',
  smoke:      on ? 'Fumaça!' : 'Sem fumaça',
  gas:        on ? 'Gás detectado' : 'Sem gás',
  vibration:  on ? 'Vibração' : 'Parado',
  tamper:     on ? 'Violado' : 'Íntegro'
}[m] || (on ? 'Ativo' : 'Inativo'));

const rotuloEvento = e => ({
  single:'toque', double:'toque duplo', triple:'toque triplo',
  hold:'pressionado', release:'solto', on:'ligar', off:'desligar',
  brightness_move_up:'aumentar', brightness_move_down:'diminuir'
}[e] || e);

/** Ícone do device, deduzido das capabilities — não do modelo. */
function iconeDe(d){
  const t = new Set(d.capabilities.map(c=>c.type));
  const m = new Set(d.capabilities.map(c=>c.measure).filter(Boolean));
  if (t.has('lock'))       return 'ic-lock';
  if (t.has('cover'))      return 'ic-cover';
  if (t.has('thermostat')) return 'ic-ac';
  if (t.has('event'))      return 'ic-scene';
  if (m.has('water_leak')) return 'ic-leak';
  if (m.has('occupancy') || m.has('motion')) return 'ic-motion';
  if (m.has('contact'))    return 'ic-door';
  if (m.has('temperature'))return 'ic-thermo';
  if (m.has('power') && !t.has('dimmer')) return 'ic-plug';
  if (t.has('dimmer') || t.has('color_temp') || t.has('color')) return 'ic-bulb';
  if (t.has('switch'))     return 'ic-plug';
  return 'ic-bulb';
}

/** A capability que representa o aparelho na lista. */
function principal(d){
  const uteis = d.capabilities
    .filter(c => REND[c.type])
    .sort((a,b) => (REND[b.type].peso||0) - (REND[a.type].peso||0));
  return uteis[0] || null;
}

const desatualizado = d =>
  !d.reachability.online || Date.now() - Date.parse(d.reachability.lastSeen) > 3*3600e3;

/** Uma linha de texto que diz a verdade sobre o aparelho. */
function resumoDevice(d){
  if (desatualizado(d)) return 'sem reportar · ' + faz(d.reachability.lastSeen);

  const teclas = caps(d,'switch');
  if (teclas.length > 1){
    const n = teclas.filter(c=>c.state).length;
    return n ? `${n} de ${teclas.length} ligados` : 'Tudo desligado';
  }

  const p = principal(d);
  if (!p) return d.model.friendlyType;

  if (p.type === 'switch'){
    if (!p.state) return 'Desligado';
    const dim = cap1(d,'dimmer'), ct = cap1(d,'color_temp');
    if (dim) return `${dim.value}%` + (ct ? ` · ${ct.kelvin}K` : '');
    const pot = d.capabilities.find(c=>c.measure==='power');
    if (pot) return `${nf(pot.value)} ${pot.unit}`;
    return 'Ligado';
  }
  return REND[p.type].resumo(p);
}

const acesoDevice = d => {
  const p = principal(d);
  return !!(p && REND[p.type].aceso?.(p));
};
const pendenteDevice = d => d.capabilities.some(c=>c._pend);
const falhouDevice   = d => d.capabilities.some(c=>c._falhou);

function faz(iso){
  const s = Math.max(0, Math.round((Date.now()-Date.parse(iso))/1000));
  if (s < 60)   return 'agora';
  if (s < 3600) return 'há ' + Math.floor(s/60) + ' min';
  if (s < 86400)return 'há ' + Math.floor(s/3600) + ' h';
  return 'há ' + Math.floor(s/86400) + ' d';
}
const pctEntre = (v,a,b) => (clamp((v-a)/(b-a),0,1)*100).toFixed(1);

/* ═══════════════════════════════════════════════════════════════
   CARGA
   ═══════════════════════════════════════════════════════════════ */
async function carregarDevices(){
  const r = await API.req('GET','/devices');
  // Preserva o que é só do cliente (pendências em voo) ao refazer o GET.
  const antes = new Map(S.devices.map(d=>[d.id,d]));
  for (const d of r.devices){
    const velho = antes.get(d.id);
    if (!velho) continue;
    for (const c of d.capabilities){
      const vc = velho.capabilities.find(x=>x.id===c.id);
      if (vc?._pend) c._pend = true;
    }
  }
  S.devices = r.devices;
}

async function carregarExtensoes(){
  const [sc, md, au, sg, us] = await Promise.all([
    API.req('GET','/scenes').catch(()=>({scenes:[]})),
    API.req('GET','/modes').catch(()=>({current:'normal',available:[]})),
    API.req('GET','/automations').catch(()=>({automations:[]})),
    API.req('GET','/suggestions').catch(()=>({suggestions:[]})),
    papelAtual()==='owner'
      ? API.req('GET','/users').catch(()=>({users:[]}))
      : Promise.resolve({users:[]})
  ]);
  S.scenes = sc.scenes; S.modes = md;
  S.automations = au.automations; S.suggestions = sg.suggestions;
  S.usuarios = us.users;
}

async function carregarTudo(){
  S.home = await API.req('GET','/home');
  await carregarDevices();
  await carregarExtensoes();
  if (!S.area && S.home.areas.length) S.area = S.home.areas[0].id;
}

/* ═══════════════════════════════════════════════════════════════
   RENDERIZAÇÃO
   ═══════════════════════════════════════════════════════════════ */
let travado = false, agendado = false;
/* O que estava aberto no último desenho ("<deviceId>|c"). Se o próximo
   desenho abre exatamente o mesmo, é atualização — não reabertura. */
let desenhoAnterior = '|';

function render(){
  if (travado || agendado) return;
  agendado = true;
  requestAnimationFrame(()=>{ agendado = false; desenhar(); });
}

function desenhar(){
  const camada = el('layer');

  if (S.tela !== 'app'){
    el('shell').setAttribute('data-entrada','1');
    desenhoAnterior = '|';
    camada.classList.remove('sem-anim');
    camada.innerHTML = telaEntrada() + (S.toast ? toastHTML() : '');
    return;
  }
  el('shell').removeAttribute('data-entrada');

  const T = { home:[S.home.name || 'Início', saudacao()],
              rooms:['Cômodos', nomeArea(S.area)],
              scenes:['Cenas e automações','Cenas'],
              energy:['Consumo','Energia'],
              settings:['Sistema','Ajustes'] }[S.view];
  el('eyebrow').textContent = T[0];
  el('title').textContent   = T[1];
  el('statusbar').innerHTML = barraStatus();

  el('view').innerHTML = ({ home:vHome, rooms:vAreas, scenes:vCenas,
                            energy:vEnergia, settings:vAjustes })[S.view]();

  $$('#tabs .tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.v===S.view)));

  const chave = (S.sheet || '') + '|' + (S.convite ? 'c' : '');
  const mesmo = chave !== '|' && chave === desenhoAnterior;
  const rolagens = mesmo ? [...camada.querySelectorAll('.sheet-in')].map(n=>n.scrollTop) : [];
  camada.classList.toggle('sem-anim', mesmo);
  desenhoAnterior = chave;

  camada.innerHTML = (S.sheet ? sheetDevice(S.sheet) : '')
                   + (S.convite ? sheetConvite() : '')
                   + (S.toast ? toastHTML() : '');
  if (S.sheet) ligarControles();
  // A chave garante os mesmos sheets na mesma ordem — restaurar por índice.
  if (mesmo) [...camada.querySelectorAll('.sheet-in')].forEach((n,i)=>{
    if (rolagens[i]) n.scrollTop = rolagens[i];
  });
}

function saudacao(){
  const h = new Date().getHours();
  return h<5 ? 'Boa madrugada' : h<12 ? 'Bom dia' : h<18 ? 'Boa tarde' : 'Boa noite';
}

function barraStatus(){
  const fora = S.devices.filter(desatualizado).length;
  const p = [];
  p.push(`<span class="dot ${S.conn==='on'?'':'warn'}"></span>central ${S.conn==='on'?'ligada':'reconectando…'}`);
  p.push(`<span class="status-sep">/</span>${S.devices.length} aparelhos`);
  if (fora) p.push(`<span class="status-sep">/</span><span style="color:var(--alert)">${fora} sem reportar</span>`);
  p.push(`<span class="status-sep">/</span>${nf(potenciaTotal())} W`);
  if (S.demo) p.push('<span class="chip-demo">DEMO</span>');
  return p.join(' ');
}

const potenciaTotal = () => S.devices.reduce((a,d)=>
  a + d.capabilities.filter(c=>c.measure==='power')
        .reduce((x,c)=> x + (Number.isFinite(c.value)?c.value:0), 0), 0);

/* ── Início ─────────────────────────────────────────────────── */
function vHome(){

  const alertas = avisos();

  return `
  <div class="readouts">
    <div class="readout"><span class="k">Ligados</span><span class="v">${acesos}</span></div>
    <div class="readout"><span class="k">Agora</span><span class="v">${nf(potenciaTotal())}<u>W</u></span></div>
    <div class="readout"><span class="k">Externa</span><span class="v">${
      temp ? nf(temp.value,temp.precision) : '—'}<u>°C</u></span></div>
  </div>

  ${S.modes.available.length ? `<div class="section">
    <div class="section-head"><h2>Modo da casa</h2><span class="aux">muda o que as automações fazem</span></div>
    <div class="modos" role="tablist">${S.modes.available.map(m=>`
      <button class="modo" role="tab" data-act="modo" data-v="${m.id}"
              aria-selected="${S.modes.current===m.id}">
        <svg><use href="#${m.icon||'ic-home'}"/></svg>${esc(m.name)}
      </button>`).join('')}</div>
  </div>` : ''}

  ${alertas.length ? `<div class="section">${alertas.join('')}</div>` : ''}

  ${S.suggestions.length ? `<div class="section">
    <div class="section-head"><h2>A casa aprendeu algo</h2>${
      S.suggestions.length>1 ? `<span class="aux">${S.suggestions.length-1} depois desta</span>`:''}</div>
    ${cartaoSugestao(S.suggestions[0])}
  </div>` : ''}

  ${S.scenes.length ? `<div class="section">
    <div class="section-head"><h2>Cenas</h2></div>
    <div class="scenerow">${S.scenes.map(s=>`
      <button class="scene" data-act="cena" data-v="${s.id}">
        <svg><use href="#${s.icon||'ic-scene'}"/></svg>${esc(s.name)}
      </button>`).join('')}</div>
  </div>` : ''}

  <div class="section">
    <div class="section-head"><h2>Favoritos</h2><span class="aux">${favs.length} de ${S.devices.length}</span></div>
    <div class="grid">${ favs.length ? favs.map(cartao).join('')
      : '<p class="empty" style="grid-column:1/-1">Nenhum favorito ainda. Abra um aparelho e toque em Favoritar.</p>' }</div>
  </div>`;
}

function avisos(){
  const out = [];
  const molhado = S.devices.find(d=>d.capabilities.some(c=>c.measure==='water_leak' && c.state));
  const abertos = S.devices.filter(d=>d.capabilities.some(c=>c.measure==='contact' && c.state));
  const pilha   = S.devices.filter(d=> d.reachability.battery!==null && d.reachability.battery < 60);
  const fumaca  = S.devices.find(d=>d.capabilities.some(c=>
    (c.measure==='smoke'||c.measure==='gas') && c.state));

  if (fumaca)  out.push(banner('ic-alert', `Alarme em ${nomeArea(fumaca.areaId)}. Verifique agora.`));
  if (molhado) out.push(banner('ic-leak', `Água detectada em ${nomeArea(molhado.areaId)}.`));
  if (abertos.length) out.push(banner('ic-door', abertos.map(d=>d.name).join(', ') + ' aberta.'));
  if (pilha.length) out.push(banner('ic-batt', pilha.length===1
    ? `Bateria de "${pilha[0].name}" em ${pilha[0].reachability.battery}%.`
    : `${pilha.length} sensores com bateria abaixo de 60%.`, true));
  return out;
}
const banner=(ic,txt,calmo)=>`<div class="banner${calmo?' calm':''}"><svg><use href="#${ic}"/></svg><span>${esc(txt)}</span></div>`;

function cartao(d){
  const on = acesoDevice(d), velho = desatualizado(d);
  return `<div class="tile${on?' on':''}${pendenteDevice(d)?' pending':''}${
      falhouDevice(d)?' rejected':''}${velho?' off-net':''}"
      data-act="abrir" data-d="${d.id}">
    <div class="tile-top">
      <span class="tile-ico"><svg><use href="#${iconeDe(d)}"/></svg></span>
      <span class="tile-more"><svg><use href="#ic-chev"/></svg></span>
    </div>
    <div>
      <div class="tile-name">${esc(d.name)}</div>
      <div class="tile-sub">${esc(resumoDevice(d))}</div>
    </div>
  </div>`;
}

/* ── Cômodos ────────────────────────────────────────────────── */
function vAreas(){
  const aid = S.area || S.home.areas[0]?.id;
  const lista = S.devices.filter(d=>d.areaId===aid);
  const semArea = S.devices.filter(d=>!d.areaId);
  const n = lista.filter(acesoDevice).length;

  return `
  <div class="pills" role="tablist">${S.home.areas.map(a=>`
    <button class="pill" role="tab" data-act="area" data-v="${a.id}"
            aria-selected="${a.id===aid}">${esc(a.name)}</button>`).join('')}
    ${semArea.length ? `<button class="pill" role="tab" data-act="area" data-v="__sem"
      aria-selected="${aid==='__sem'}">Sem cômodo · ${semArea.length}</button>` : ''}</div>

  <div class="section">
    <div class="section-head">
      <h2>${esc(aid==='__sem' ? 'Sem cômodo' : nomeArea(aid))}</h2>
      <span class="aux">${n ? n + (n>1?' ligados':' ligado') : 'tudo desligado'}</span>
    </div>
    <div class="list">${
      (aid==='__sem' ? semArea : lista).map(linha).join('') ||
      '<p class="empty">Nenhum aparelho aqui ainda.</p>'}</div>
  </div>`;
}

function linha(d){
  const velho = desatualizado(d);
  const p = principal(d);
  const teclas = caps(d,'switch');

  let aux;
  if (teclas.length > 1) aux = `<span class="row-val">${teclas.filter(c=>c.state).length}/${teclas.length}</span>
    <svg><use href="#ic-chev"/></svg>`;
  else if (p && REND[p.type].atalho) aux = REND[p.type].atalho(d,p);
  else if (p?.type === 'cover') aux = `<span class="row-val">${p.position}%</span><svg><use href="#ic-chev"/></svg>`;
  else if (p?.type === 'sensor') aux = `<span class="row-val">${nf(p.value,p.precision)}</span>
    <span style="font-size:11px;color:var(--text-faint)">${esc(p.unit)}</span>`;
  else aux = `<svg><use href="#ic-chev"/></svg>`;

  return `<button class="row${pendenteDevice(d)?' pending':''}${falhouDevice(d)?' rejected':''}"
      data-act="abrir" data-d="${d.id}" style="${velho?'opacity:.55':''}">
    <span class="row-ico${acesoDevice(d)?' lit':''}"><svg><use href="#${iconeDe(d)}"/></svg></span>
    <span class="row-main">
      <span class="row-name">${esc(d.name)}</span>
      <span class="row-sub">${esc(resumoDevice(d))}</span>
    </span>
    <span class="row-aux">${aux}</span>
  </button>`;
}

        <span class="row-aux">${ene?`<span class="row-val">${nf(ene.value,2)}</span>
          <span style="font-size:11px;color:var(--text-faint)">kWh</span>`:''}</span>

function barrasPorAparelho(medidos){
  const comPot = medidos.filter(x=>x.pot && x.pot.value>0);
  if (!comPot.length) return '<p class="empty" style="padding:14px 0">Nada consumindo agora.</p>';
  const max = Math.max(...comPot.map(x=>x.pot.value));
  const W = 300, H = 100, g = 6, bw = (W - g*(comPot.length-1)) / comPot.length;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
    aria-label="Consumo por aparelho">${comPot.map((x,i)=>{
      const h = Math.max(3, x.pot.value/max*H);
      return `<rect x="${(i*(bw+g)).toFixed(1)}" y="${(H-h).toFixed(1)}"
        width="${bw.toFixed(1)}" height="${h.toFixed(1)}"
        rx="${Math.min(3,bw/2).toFixed(1)}" fill="${i===0?'var(--accent-fill)':'var(--chart-bar)'}"/>`;
    }).join('')}</svg>
    <div class="chart-axis">${comPot.slice(0,3).map(x=>
      `<span>${esc(x.d.name.slice(0,14))}</span>`).join('')}</div>`;
}

/* ── Série de 24 h no sheet do aparelho ─────────────────────────── */
/* undefined = nunca pedimos · null = pedido em voo · false = sem acesso
   ou sem dados · array = pontos prontos. */
function pedirSerie(deviceId, cap){
  const k = `${deviceId}:${cap.id}`;
  S.series[k] = null;
  API.req('GET', `/devices/${deviceId}/history?capabilityId=${
      encodeURIComponent(cap.id)}&bucket=15m`)
    .then(r => { S.series[k] = (r.points && r.points.length > 2) ? r.points : false; render(); })
    .catch(() => { S.series[k] = false; });   // visita sem permissão: silêncio
}

function sparkline(pts, cap){
  const W = 320, H = 64;
  const vs = pts.map(p => p.v);
  const min = Math.min(...vs), max = Math.max(...vs), span = (max - min) || 1;
  const xy = pts.map((p,i) => [
    (i / (pts.length - 1)) * W,
    H - 6 - ((p.v - min) / span) * (H - 16)
  ]);
  const linha = xy.map(([x,y],i) => `${i ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)}`).join(' ');
  const [ux, uy] = xy[xy.length - 1];
  return `<div class="cap">
    <div class="cap-topo"><span class="cap-nome">Últimas 24 h · ${esc(rotuloMedida(cap.measure))}</span>
      <span class="cap-val">${nf(vs[vs.length-1], cap.precision)} ${esc(cap.unit)}</span></div>
    <svg viewBox="0 0 ${W} ${H}" style="display:block;width:100%;height:auto" role="img"
         aria-label="Série das últimas 24 horas">
      <path d="${linha} L${W} ${H} L0 ${H} Z" fill="var(--accent-soft)"/>
      <path d="${linha}" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
      <circle cx="${ux.toFixed(1)}" cy="${uy.toFixed(1)}" r="3" fill="var(--accent-fill)"/>
    </svg>
    <div style="display:flex;justify-content:space-between;font-family:var(--font-mono);
                font-size:10px;color:var(--text-faint)">
      <span>mín ${nf(min, cap.precision)}</span><span>máx ${nf(max, cap.precision)}</span>
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════════════════════════
   SHEET — monta o aparelho a partir das capabilities dele
   ═══════════════════════════════════════════════════════════════ */
function sheetDevice(id){
  const d = dev(id); if(!d) return '';

  const teclas = caps(d,'switch');
  const dim = cap1(d,'dimmer'), ct = cap1(d,'color_temp');
  const cor = cap1(d,'color'), cov = cap1(d,'cover'), lock = cap1(d,'lock');
  const brilho = dim ? dim.value : 0;
  const bloomA = (dim && teclas[0]?.state !== false) ? bloom(brilho) : '0';
  const bloomC = ct ? `--bloom-c:${kelvinHex(ct.kelvin, ct.minKelvin, ct.maxKelvin)};` : '';

  /* Bloco principal: o controle que mais importa neste aparelho. */
  let topo = '';
  if (dim){
    topo = `<div class="control">
      ${colunaVertical(dim, d, 'Brilho', '%')}
      <div class="control-side">
        ${teclas[0] ? REND.switch.controle(d, teclas[0]) : ''}
        <button class="bigbtn quiet" data-act="fav" data-d="${d.id}" aria-pressed="${d.favorite}">
          <svg><use href="#ic-scene"/></svg>${d.favorite?'Nos favoritos':'Favoritar'}
        </button>
      </div>
    </div>`;
  } else if (cov){
    topo = REND.cover.controle(d, cov);
  } else if (lock){
    topo = `<div class="control">${REND.lock.controle(d, lock)}</div>`;
  } else if (teclas.length === 1){
    const pot = d.capabilities.find(c=>c.measure==='power');
    topo = `<div class="control" style="min-height:130px">
      ${REND.switch.controle(d, teclas[0])}
      ${pot ? `<div class="bigbtn" style="pointer-events:none">
        <span style="font-family:var(--font-display);font-size:29px;font-weight:200;
          letter-spacing:-.03em">${nf(pot.value)}<u style="font-size:13px;font-weight:500;
          text-decoration:none">${esc(pot.unit)}</u></span></div>` : ''}
    </div>`;
  } else if (teclas.length > 1){
    // Multi-canal: um device, uma linha por tecla (§2.1).
    topo = `<div class="canais">${teclas.map(c=>`
      <div class="canal">
        <span class="canal-nome">${esc(c.label || c.id)}</span>
        ${REND.switch.atalho(d,c)}
      </div>`).join('')}</div>`;
  }

  /* Demais capabilities, cada uma se desenhando. Tipo que este cliente
     não conhece some daqui sem alarde — e sem levar o aparelho junto. */
  const jaMostradas = new Set([
    ...teclas.map(c=>c.id), dim?.id, cov?.id, lock?.id
  ].filter(Boolean));

  const resto = d.capabilities
    .filter(c => !jaMostradas.has(c.id) && REND[c.type]?.controle)
    .map(c => REND[c.type].controle(d, c)).join('');

  const ignoradas = d.capabilities.filter(c => !REND[c.type]).length;
  const velho = desatualizado(d);
  const r = d.reachability;

  // A grandeza que vale um gráfico: potência se houver, senão temperatura.
  const medida = d.capabilities.find(c => c.measure === 'power')
              || d.capabilities.find(c => c.measure === 'temperature');
  let graf = '';
  if (medida){
    const serie = S.series[`${d.id}:${medida.id}`];
    if (serie === undefined) pedirSerie(d.id, medida);
    else if (Array.isArray(serie)) graf = sparkline(serie, medida);
  }

  return `
  <div class="scrim" data-act="fechar"></div>
  <section class="sheet" style="${bloomC}--bloom-a:${bloomA}" role="dialog" aria-modal="true"
           aria-label="${esc(d.name)}">
    <div class="sheet-in">
      <div class="grab"></div>
      <div class="sheet-head">
        <div>
          <h2>${esc(d.name)}</h2>
          <div class="where">${esc(nomeArea(d.areaId))}${velho?' · sem reportar':''}</div>
        </div>
        <button class="head-btn" data-act="fechar" aria-label="Fechar">
          <svg width="17" height="17"><use href="#ic-x"/></svg>
        </button>
      </div>

      ${topo}
      ${resto}
      ${graf}

      <div class="specs">
        ${r.signal!==null ? `<div class="spec"><span class="k">Sinal na malha</span>
          <span class="v">${barrasSinal(r.signal)}${r.signal}${r.signal<30?' · fraco':''}</span></div>`:''}
        ${r.battery!==null ? `<div class="spec"><span class="k">Bateria</span>
          <span class="v" style="${r.battery<60?'color:var(--alert)':''}">${r.battery}%</span></div>`:''}
        <div class="spec"><span class="k">Última resposta</span><span class="v">${faz(r.lastSeen)}</span></div>
        <div class="spec"><span class="k">Tipo</span><span class="v">${esc(d.model.friendlyType)}</span></div>
        <div class="spec"><span class="k">Fabricante</span>
          <span class="v">${esc(d.model.manufacturer)} ${esc(d.model.model)}</span></div>
        <div class="spec"><span class="k">Identificador</span><span class="v mono">${esc(d.id)}</span></div>
        ${ignoradas ? `<div class="spec"><span class="k">Funções não suportadas</span>
          <span class="v">${ignoradas} — este app é mais antigo que a central</span></div>`:''}
      </div>
    </div>
  </section>`;
}

/** Coluna de brilho, com a leitura desenhada duas vezes e recortada
 *  pelo preenchimento — o número troca de cor na linha da luz. */
function colunaVerticalCrua(valor, icone, rotulo, devId, capId, min){
  const corpo = `<span class="vslider-ico"><svg><use href="#${icone}"/></svg></span>`
              + `<span class="vslider-txt">${valor}<u>%</u></span>`;
  return `<div class="vslider" id="vs" data-d="${devId}" data-c="${esc(capId)}" data-min="${min}"
       role="slider" tabindex="0" aria-label="${esc(rotulo)}"
       aria-valuemin="${min}" aria-valuemax="100" aria-valuenow="${valor}">
    ${corpo}
    <div class="vfill" id="vfill" style="height:${valor}%"><div class="vfill-clip">${corpo}</div></div>
  </div>`;
}
const colunaVertical = (c, d, rotulo) =>
  colunaVerticalCrua(c.value, iconeDe(d), `${rotulo} de ${esc(d.name)}`, d.id, c.id, 0);

/** Cor aproximada de uma temperatura em Kelvin — o halo atrás do sheet. */
function kelvinHex(k, min, max){
  const t = clamp((k - (min||2000)) / ((max||6500) - (min||2000)), 0, 1);
  const a=[255,158,61], b=[214,233,255];
  return '#' + a.map((v,i)=> Math.round(v + (b[i]-v)*t).toString(16).padStart(2,'0')).join('');
}
const bloom = v => (0.08 + clamp(v,0,100)/100*0.28).toFixed(3);

/* ── Arrasto ────────────────────────────────────────────────── */
function ligarControles(){
  const vs = $('#vs');
  if (vs){
    const fill = $('#vfill'), rotulos = $$('.vslider-txt', vs);
    const min = +vs.dataset.min || 0;
    const devId = vs.dataset.d, capId = vs.dataset.c;
    const d = dev(devId);
    const ehCortina = !!d?.capabilities.find(c=>c.id===capId && c.type==='cover');
    let ultimo = 0, valor = +vs.getAttribute('aria-valuenow');

    const ler = y=>{ const r = vs.getBoundingClientRect();
      return clamp(Math.round((1 - (y-r.top)/r.height)*100), min, 100); };

    const pintar = v=>{
      fill.style.height = v + '%';
      rotulos.forEach(n=>{ n.innerHTML = v + '<u>%</u>'; });
      vs.setAttribute('aria-valuenow', v);
      const sheet = $('.sheet');
      if (sheet && !ehCortina) sheet.style.setProperty('--bloom-a', v===0 ? '0' : bloom(v));
    };

    /* A malha congestiona se cada pixel virar um comando: os relatos dos
       sensores param de chegar enquanto se arrasta. No máximo ~4 por
       segundo, e o valor final sempre, ao soltar. */
    const enviar = (v, final)=>{
      const t = Date.now();
      if (!final && t - ultimo < 240) return;
      ultimo = t;
      comandar(devId, capId, ehCortina ? {type:'cover', position:v} : {type:'dimmer', value:v});
    };

    vs.addEventListener('pointerdown', e=>{
      travado = true; vs.classList.add('dragging'); vs.setPointerCapture(e.pointerId);
      valor = ler(e.clientY); pintar(valor); e.preventDefault();
    });
    vs.addEventListener('pointermove', e=>{
      if (!vs.hasPointerCapture(e.pointerId)) return;
      valor = ler(e.clientY); pintar(valor); enviar(valor, false);
    });
    const soltar = ()=>{ if(!travado) return;
      travado = false; vs.classList.remove('dragging'); enviar(valor, true); render(); };
    vs.addEventListener('pointerup', soltar);
    vs.addEventListener('pointercancel', soltar);
    vs.addEventListener('keydown', e=>{
      const p = e.key==='ArrowUp'?5 : e.key==='ArrowDown'?-5 : 0;
      if(!p) return; e.preventDefault();
      valor = clamp(valor+p, min, 100); pintar(valor); enviar(valor, true);
    });
  }

  faixaHorizontal('#ct', '#ct-knob', '#ct-val', (v,el)=>`${v}K`,
    (v,el)=>({type:'color_temp', kelvin:v}), 50);
  faixaHorizontal('#hue', '#hue-knob', '#hue-val', v=>`${v}°`,
    v=>({type:'color', hue:v, saturation:80}), 1, 0, 360);
}

function faixaHorizontal(sel, selKnob, selVal, texto, comando, passo, forcaMin, forcaMax){
  const t = $(sel); if(!t) return;
  const knob = $(selKnob), lab = $(selVal);
  const min = forcaMin ?? +t.dataset.min, max = forcaMax ?? +t.dataset.max;
  const devId = t.dataset.d, capId = t.dataset.c;
  let ultimo = 0, valor = +t.getAttribute('aria-valuenow');

  const ler = x=>{ const r = t.getBoundingClientRect();
    return Math.round((min + clamp((x-r.left)/r.width,0,1)*(max-min))/passo)*passo; };
  const pintar = v=>{
    valor = clamp(v, min, max);
    knob.style.left = pctEntre(valor,min,max) + '%';
    if (lab) lab.textContent = texto(valor);
    t.setAttribute('aria-valuenow', valor);
    const sheet = $('.sheet');
    if (sheet && sel === '#ct') sheet.style.setProperty('--bloom-c', kelvinHex(valor,min,max));
  };
  const enviar = final=>{ const n = Date.now();
    if(!final && n-ultimo < 240) return; ultimo = n; comandar(devId, capId, comando(valor)); };

  t.addEventListener('pointerdown', e=>{
    travado = true; t.setPointerCapture(e.pointerId); pintar(ler(e.clientX)); e.preventDefault(); });
  t.addEventListener('pointermove', e=>{
    if (!t.hasPointerCapture(e.pointerId)) return; pintar(ler(e.clientX)); enviar(false); });
  const soltar = ()=>{ if(!travado) return; travado = false; enviar(true); render(); };
  t.addEventListener('pointerup', soltar);
  t.addEventListener('pointercancel', soltar);
  t.addEventListener('keydown', e=>{
    const p = e.key==='ArrowRight'? passo*10 : e.key==='ArrowLeft'? -passo*10 : 0;
    if(!p) return; e.preventDefault(); pintar(valor+p); enviar(true);
  });
}
