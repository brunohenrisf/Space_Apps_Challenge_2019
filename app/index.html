function telaEntrada(){
  if (S.tela === 'carregando')
    return `<div class="entrada"><div class="marca"><svg><use href="#ic-hub"/></svg></div>
      <p class="sub">Procurando a central…</p></div>`;

  const claim = S.tela === 'claim';
  const resgate = S.tela === 'resgate';
  const modo = claim ? 'claim' : resgate ? 'resgate' : 'login';
  return `<div class="entrada">
    <div class="marca"><svg><use href="#ic-hub"/></svg></div>
    <h2>${claim ? 'Vamos configurar sua casa'
        : resgate ? 'Entrar com um convite'
        : esc(S.home.name || 'Entrar na casa')}</h2>
    <p class="sub">${claim
      ? 'Esta central ainda não tem dono. Quem criar a conta agora será o administrador.'
      : resgate
      ? 'Digite o código que apareceu na tela de quem convidou você.'
      : 'Entre com a conta que você criou nesta central.'}</p>

    <form class="form" data-act="entrar" data-v="${modo}">
      ${resgate ? `<input class="campo" name="code" placeholder="Código do convite"
             autocomplete="one-time-code" style="text-transform:uppercase;letter-spacing:.14em;
             font-family:var(--font-mono);text-align:center" required>` : ''}
      ${claim || resgate ? `${claim ? `<input class="campo" name="homeName" placeholder="Nome da casa" value="Minha casa" required>` : ''}
                 <input class="campo" name="name" placeholder="Seu nome" required>` : ''}
      <input class="campo" name="email" type="email" inputmode="email" autocomplete="username"
             placeholder="E-mail" required>
      <input class="campo" name="password" type="password"
             autocomplete="${claim||resgate?'new-password':'current-password'}"
             placeholder="Senha${claim||resgate?' (mínimo 8 caracteres)':''}" required
             ${claim||resgate?'minlength="8"':''}>
      ${S.erroForm ? `<p class="erro-form">${esc(S.erroForm)}</p>` : ''}
      <button class="botao" type="submit" ${S.ocupado?'disabled':''}>${
        S.ocupado ? 'Um momento…'
        : claim ? 'Criar conta e assumir a central'
        : resgate ? 'Resgatar convite e entrar' : 'Entrar'}</button>
    </form>

    ${!claim && !resgate ? `<button class="botao fraco" data-act="irResgate">Tenho um convite</button>` : ''}
    ${resgate ? `<button class="botao fraco" data-act="voltarLogin">Voltar para o login</button>` : ''}
    ${S.demo || claim || resgate ? '' : `<button class="botao fraco" data-act="demo">Ver demonstração sem central</button>`}
    <p class="aviso-mini">Central: ${esc(location.host || '—')}${S.demo ? ' · demonstração' : ''}<br>
      A conta vive só nesta central. Nada é enviado para a internet.</p>
  </div>`;
}

async function submeterEntrada(form, modo){
  const dados = Object.fromEntries(new FormData(form));
  if (dados.code) dados.code = dados.code.trim().toUpperCase();
  S.ocupado = true; S.erroForm = null; render();
  try{
    const caminho = modo==='claim' ? '/setup/claim'
                  : modo==='resgate' ? '/auth/redeem' : '/auth/login';
    const par = await API.req('POST', caminho, dados);
    API.guardar(par);
    await entrarNoApp();
  }catch(e){
    S.erroForm = e.message || 'Não consegui entrar.';
  }finally{
    S.ocupado = false; render();
  }
}

async function entrarNoApp(){
  await carregarTudo();
  S.tela = 'app';
  Stream.abrir();
  render();
}

document.addEventListener('submit', e=>{
  const f = e.target.closest('[data-act="entrar"]');
  if (!f) return;
  e.preventDefault();
  submeterEntrada(f, f.dataset.v);
});

document.addEventListener('click', async e=>{
  const t = e.target.closest('[data-act]'); if(!t) return;
  const { act, d:devId, c:capId, v, x } = t.dataset;

  if (act === 'tab'){ S.view = v; S.sheet = null; el('view').scrollTop = 0; return render(); }
  if (act === 'area'){ S.area = v; return render(); }
  if (act === 'fechar'){ S.sheet = null; return render(); }

  if (act === 'abrir'){
    if (e.target.closest('.sw')) return;     // o interruptor da linha alterna
    S.sheet = devId; return render();
  }

  if (act === 'toggle'){
    e.stopPropagation();
    const c = dev(devId)?.capabilities.find(x=>x.id===capId); if(!c) return;
    return comandar(devId, capId, c.type==='lock'
      ? { type:'lock', state: c.state==='locked' ? 'unlocked' : 'locked' }
      : { type:'switch', toggle:true });
  }

  if (act === 'cover') return comandar(devId, capId, { type:'cover', action:v });

  if (act === 'termo'){
    const c = dev(devId)?.capabilities.find(y=>y.id===capId); if(!c) return;
    const alvo = clamp(c.targetTemp + (v==='+' ? c.step : -c.step), c.minTemp, c.maxTemp);
    return comandar(devId, capId, { type:'thermostat', targetTemp:+alvo.toFixed(1) });
  }
  if (act === 'termo-modo') return comandar(devId, capId, { type:'thermostat', mode:v });

  if (act === 'fav'){
    const d = dev(devId); if(!d) return;
    d.favorite = !d.favorite;
    API.req('POST', `/devices/${devId}/favorite`, { favorite:d.favorite }).catch(()=>{});
    return render();
  }

  if (act === 'cena'){
    try{
      const r = await API.req('POST', `/scenes/${v}/activate`);
      aviso(`Cena aplicada em ${r.commandIds.length} aparelhos.`, 'ic-check');
    }catch(err){ aviso(err.message, 'ic-alert'); }
    return;
  }

  if (act === 'modo'){
    S.modes.current = v; render();
    try{ await API.req('PUT','/modes/current',{ mode:v });
         aviso('Modo da casa: ' + (S.modes.available.find(m=>m.id===v)?.name||v) + '.', 'ic-check');
         await carregarExtensoes(); }
    catch(err){ aviso(err.message, 'ic-alert'); }
    return render();
  }

  if (act === 'automacao'){
    const a = S.automations.find(y=>y.id===v); if(!a) return;
    a.on = !a.on; render();
    try{ await API.req('PATCH', `/automations/${v}`, { on:a.on }); await carregarExtensoes(); }
    catch(err){ a.on = !a.on; aviso(err.message, 'ic-alert'); }
    return render();
  }

  if (act === 'sug'){
    const g = S.suggestions.find(y=>y.id===v);
    S.suggestions = S.suggestions.filter(y=>y.id!==v);
    render();
    try{
      await API.req('POST', `/suggestions/${encodeURIComponent(v)}/decide`, { decision:x });
      if (x === 'aceitar') aviso(g?.tipo==='recuar'
        ? 'Automação suspensa. Pergunto de novo em duas semanas.'
        : 'Automação criada. Nos primeiros 3 dias eu aviso antes de agir.', 'ic-check');
      else if (x === 'depois') aviso('Guardado. Trago de novo mais para a frente.', 'ic-clock');
      else aviso('Não sugiro mais isso.', 'ic-check');
      await carregarExtensoes();
    }catch(err){ aviso(err.message, 'ic-alert'); }
    return render();
  }

  if (act === 'parear'){
    try{
      const r = await API.req('POST','/pairing/start',{ durationSec:120 });
      aviso(`Rede aberta por ${r.durationSec}s. Coloque o aparelho em pareamento.`, 'ic-plus');
    }catch(err){ aviso(err.message, 'ic-alert'); }
    return;
  }

  if (act === 'convite'){
    try{
      const r = await API.req('POST','/invites',
        { role: v,
          allowedDeviceIds: v==='guest' ? S.devices.filter(d=>d.favorite).map(d=>d.id) : null,
          validoPorHoras: v==='guest' ? 24 : 72 });
      S.convite = { ...r, role: v };
    }catch(err){ aviso(err.message, 'ic-alert'); }
    return render();
  }
  if (act === 'fecharConvite'){ S.convite = null; return render(); }
  if (act === 'irResgate'){ S.tela = 'resgate'; S.erroForm = null; return render(); }
  if (act === 'voltarLogin'){ S.tela = 'login'; S.erroForm = null; return render(); }

  if (act === 'demo'){ S.demo = true; Demo.iniciar(); return entrarNoApp(); }

  if (act === 'sair'){
    try{ await API.req('POST','/auth/logout',{ refreshToken: API.ref }); }catch(_){ }
    API.limpar(); try{ Stream.ws?.close(); }catch(_){ }
    S.tela = 'login'; S.devices = []; return render();
  }

  if (act === 'theme'){ S.theme = v; guarda.gravar('nexo.theme', v); aplicarTema(); return render(); }
  if (act === 'palette'){ S.palette = v; guarda.gravar('nexo.palette', v); aplicarTema(); return render(); }
});

document.addEventListener('keydown', e=>{
  if (e.key !== 'Escape') return;
  if (S.convite){ S.convite = null; render(); }
  else if (S.sheet){ S.sheet = null; render(); }
});

function aplicarTema(){
  if (S.theme === 'auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = S.theme;
  if (S.palette === 'ambar') delete document.documentElement.dataset.palette;
  else document.documentElement.dataset.palette = S.palette;

  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = getComputedStyle(document.documentElement)
    .getPropertyValue('--bg').trim();
}

      const est = this.devices.find(d=>d.id==='d16');
      const t = est?.capabilities.find(c=>c.measure==='temperature');
      if (t){ t.value = +clamp(t.value + (Math.random()-.5)*.3, 14, 34).toFixed(1);
              est.reachability.lastSeen = new Date().toISOString();
              this.emitir('state.changed', {deviceId:est.id, capabilityId:t.id, changes:{value:t.value}}); }
    }, 4000);
  },

  async req(metodo, caminho, corpo){
    const espera = ms => new Promise(r=>setTimeout(r,ms));
    await espera(20);

    if (caminho === '/setup/status') return { setup:0, homeName:'Casa Ribeiro', version:1 };
    if (caminho === '/auth/login' || caminho === '/setup/claim')
      return { accessToken:'demo', refreshToken:'demo', expiresIn:900 };
    if (caminho === '/home')    return this.home;
    if (caminho === '/devices') return { devices: structuredClone(this.devices).map(limparInternos) };
    if (caminho === '/scenes')  return { scenes: this.scenes };
    if (caminho === '/modes')   return this.modes;
    if (caminho === '/automations') return { automations: this.automations };
    if (caminho === '/suggestions') return { suggestions: this.suggestions };

    const cmd = caminho.match(/^\/devices\/([^/]+)\/capabilities\/([^/]+)\/command$/);
    if (cmd) return this.comandar(cmd[1], decodeURIComponent(cmd[2]), corpo);

    const cena = caminho.match(/^\/scenes\/([^/]+)\/activate$/);
    if (cena) return this.cena(cena[1]);

    if (caminho === '/modes/current'){ this.modes.current = corpo.mode;
      this.recalcularAtivas(); return { mode: corpo.mode }; }

    const aut = caminho.match(/^\/automations\/(.+)$/);
    if (aut){ const a = this.automations.find(x=>x.id===aut[1]);
      if (a) Object.assign(a, corpo); this.recalcularAtivas(); return a; }

    const sug = caminho.match(/^\/suggestions\/(.+)\/decide$/);
    if (sug){ const id = decodeURIComponent(sug[1]);
      const g = this.suggestions.find(x=>x.id===id);
      if (corpo.decision === 'aceitar' && g?.tipo === 'criar')
        this.automations.push({ id:'auto_'+Date.now().toString(36),
          name:g.acao.split(',')[0].replace(/^Acender |^Desligar /,''), desc:g.acao,
          icon:'ic-clock', on:true, modos:['normal'], activeNow:true });
      if (corpo.decision === 'aceitar' && g?.tipo === 'recuar'){
        const a = this.automations.find(x=>x.id === 'a1'); if (a) a.on = false;
      }
      if (corpo.decision !== 'depois') this.suggestions = this.suggestions.filter(x=>x.id!==id);
      else this.suggestions.push(this.suggestions.splice(this.suggestions.findIndex(x=>x.id===id),1)[0]);
      return null; }

    if (caminho === '/pairing/start') return { durationSec:120 };
    if (caminho === '/auth/logout') return null;
    if (caminho === '/auth/redeem')
      return { accessToken:'demo', refreshToken:'demo', expiresIn:900 };
    if (caminho === '/users') return { users:[
      { id:'u1', name:'Bruno',  email:'bruno@casa.test',  role:'owner' },
      { id:'u2', name:'Marina', email:'marina@casa.test', role:'member' }
    ]};
    if (caminho === '/invites'){
      const hex = [...crypto.getRandomValues(new Uint8Array(4))]
        .map(b=>b.toString(16).padStart(2,'0')).join('').toUpperCase();
      return { code: hex,
        expiresAt: new Date(Date.now() + (corpo?.validoPorHoras||24)*3600e3).toISOString() };
    }
    const hist = caminho.match(/^\/devices\/([^/]+)\/history\?/);
    if (hist) return { points: this.serieFake(hist[1]) };
    if (/\/favorite$/.test(caminho)){
      const id = caminho.split('/')[2];
      const d = this.devices.find(x=>x.id===id); if(d) d.favorite = corpo.favorite;
      return null;
    }
    return null;
  },

  /* 24 h de série sintética com a forma certa da grandeza: potência tem
   * vale de madrugada e pico à noite; temperatura é senoide do dia. */
  serieFake(deviceId){
    const d = this.devices.find(x=>x.id===deviceId);
    const ehTemp = !!d?.capabilities.some(c=>c.measure==='temperature');
    const agora = Date.now();
    const pts = [];
    for (let i = 95; i >= 0; i--){
      const t = new Date(agora - i*15*60e3);
      const h = t.getHours() + t.getMinutes()/60;
      const v = ehTemp
        ? 22 + 5*Math.sin((h-9)/24*2*Math.PI) + (Math.sin(i*2.7)*0.4)
        : Math.max(4, 60 + 90*Math.exp(-Math.pow(h-20.5,2)/6)
                        + 40*Math.exp(-Math.pow(h-7.2,2)/2.5) + Math.sin(i*1.9)*9);
      pts.push({ t: t.toISOString(), v: +v.toFixed(ehTemp?1:0) });
    }
    return pts;
  },

  recalcularAtivas(){
    for (const a of this.automations)
      a.activeNow = a.on && (!a.modos || a.modos.includes(this.modes.current));
  },

  comandar(deviceId, capId, cmd){
    const d = this.devices.find(x=>x.id===deviceId);
    if (!d) { const e = new Error('Dispositivo não encontrado.'); e.status=404; e.error='not_found'; throw e; }
    const c = d.capabilities.find(x=>x.id===capId);
    if (!c) { const e = new Error('Função não encontrada.'); e.status=404; e.error='not_found'; throw e; }

    const commandId = 'cmd-' + (++this.seq);
    const atraso = 140 + Math.random()*260;
    const perde = d._fraco && Math.random() < 0.3;

    setTimeout(()=>{
      if (perde) return this.emitir('command.result', { commandId, status:'failed',
                                                        error:'device_no_response' });
      const mudou = {};
      if (cmd.type==='switch') mudou.state = cmd.toggle ? !c.state : cmd.state;
      if (cmd.type==='dimmer'){ mudou.value = cmd.value;
        const sw = d.capabilities.find(x=>x.type==='switch');
        if (sw){ sw.state = cmd.value>0;
          this.emitir('state.changed',{deviceId,capabilityId:sw.id,changes:{state:sw.state}}); } }
      if (cmd.type==='color_temp') mudou.kelvin = cmd.kelvin;
      if (cmd.type==='color'){ mudou.hue = cmd.hue; mudou.saturation = cmd.saturation; }
      if (cmd.type==='cover') mudou.position = cmd.action==='open'?100
        : cmd.action==='close'?0 : cmd.action==='stop'?c.position : cmd.position;
      if (cmd.type==='lock') mudou.state = cmd.state;
      if (cmd.type==='thermostat'){
        if (cmd.targetTemp!==undefined) mudou.targetTemp = cmd.targetTemp;
        if (cmd.mode!==undefined) mudou.mode = cmd.mode; }

      Object.assign(c, mudou);
      d.reachability.lastSeen = new Date().toISOString();
      this.emitir('state.changed', { deviceId, capabilityId:capId, changes:mudou });

      const pot = d.capabilities.find(x=>x.measure==='power');
      if (pot && 'state' in mudou){
        pot.value = mudou.state ? (d._watts||90) : 0;
        this.emitir('state.changed',{deviceId,capabilityId:pot.id,changes:{value:pot.value}});
      }
      this.emitir('command.result', { commandId, status:'applied' });
    }, atraso);

    return { commandId, accepted:true };
  },

  cena(id){
    const passos = {
      boanoite:[['d1','switch',false],['d2','switch',false],['d7','switch',false],
                ['d14','switch',false],['d3','switch',false],['d10','switch',true]],
      cinema:  [['d1','switch',false],['d2','switch',true],['d3','switch',true]],
      bomdia:  [['d7','switch',true],['d14','switch',true]],
      jantar:  [['d1','switch',true],['d2','switch',true]],
      sair:    [['d1','switch',false],['d2','switch',false],['d3','switch',false],
                ['d7','switch',false],['d14','switch',false],['d15','switch',false]]
    }[id] || [];
    const ids = [];
    for (const [dv,cp,estado] of passos)
      ids.push(this.comandar(dv, cp, { type:'switch', state:estado }).commandId);
    return { commandIds: ids };
  }
};

const limparInternos = d => { delete d._fraco; delete d._watts; return d; };

/* ═══════════════════════════════════════════════════════════════
   PARTIDA
   ═══════════════════════════════════════════════════════════════ */
aplicarTema();

/** Procura a central com prazo e uma segunda chance.
 *
 *  Uma tentativa curta seria pior que inútil: central recém-ligada, Pi
 *  sob carga ou Wi-Fi ruim fariam o app cair na demonstração e mostrar
 *  uma casa que não existe. Duas tentativas de 4 s custam pouco e evitam
 *  o pior tipo de erro que este app pode cometer — mentir sobre o estado
 *  da casa. */
async function procurarCentral(){
  for (let tentativa = 0; tentativa < 2; tentativa++){
    try{
      const ac = new AbortController();
      const t = setTimeout(()=>ac.abort(), 4000);
      const r = await fetch('/api/v1/setup/status', { signal: ac.signal }).finally(()=>clearTimeout(t));
      if (r.ok) return await r.json();
    }catch(_){ }
    if (tentativa === 0) await new Promise(r=>setTimeout(r, 600));
  }
  return null;
}

(async function iniciar(){
  const st = await procurarCentral();
  if (st){
    S.home.name = st.homeName || 'Casa';

    if (st.setup === 1){ S.tela = 'claim'; return render(); }
    if (API.acc){
      try{ return await entrarNoApp(); }
      catch(_){ API.limpar(); }
    }
    S.tela = 'login'; return render();
  }

  // Nenhuma central alcançável: cai na demonstração, que fala o mesmo
  // contrato e permite avaliar a interface inteira. O selo DEMO na barra
  // de status fica visível o tempo todo — ninguém pode confundir isto
  // com a casa de verdade.
  S.demo = true; Demo.iniciar();
  await entrarNoApp();
})();

/* Service worker exige contexto seguro. Sobre http:// puro o iOS recusa
   o registro — o app segue funcionando, só sem cache. Ver docs/ios-pwa.md */
if ('serviceWorker' in navigator && window.isSecureContext){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
})();
</script>
