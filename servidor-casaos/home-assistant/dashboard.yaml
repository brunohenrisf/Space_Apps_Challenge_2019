# Dashboard (Lovelace) — Home Assistant no servidor CasaOS
# Estilo moderno: views do tipo "sections" com cartões "tile" (HA 2024.9+)
#
# Como aplicar:
#   Configurações > Painéis > Adicionar painel próprio > abrir > lápis >
#   menu (⋮) > "Editor de YAML bruto" > colar tudo > Salvar.
#
# ATENÇÃO AOS NOMES DAS ENTIDADES
#   Os entity_id abaixo seguem o padrão que o HA gera a partir do nome do
#   dispositivo (ex.: "Led cozinha" > switch.led_cozinha_interruptor_1).
#   Confira os seus em: Ferramentas de Desenvolvedor > Estados.
#   Qualquer cartão apontando para entidade inexistente aparece como
#   "Entity not available" — basta corrigir o nome ou apagar o cartão.

views:
  # ═══════════════════════════════════════════════════════════════
  - title: Casa
    path: casa
    icon: mdi:home
    type: sections
    max_columns: 3

    badges:
      - type: entity
        entity: weather.forecast_casa
        name: Tempo
      - type: entity
        entity: sensor.sensor_th_temperatura
        name: Temperatura
      - type: entity
        entity: sensor.sensor_th_humidade
        name: Umidade

    sections:
      # ── Iluminação da casa ───────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Iluminação
            heading_style: title
            icon: mdi:lightbulb-group

          - type: tile
            entity: switch.iluminacao_1_interruptor_1
            name: Iluminação 1 — Ponto 1
            icon: mdi:ceiling-light
            features:
              - type: toggle

          - type: tile
            entity: switch.iluminacao_1_interruptor_2
            name: Iluminação 1 — Ponto 2
            icon: mdi:ceiling-light
            features:
              - type: toggle

          - type: tile
            entity: switch.iluminacao_1_interruptor_3
            name: Iluminação 1 — Ponto 3
            icon: mdi:ceiling-light
            features:
              - type: toggle

          - type: tile
            entity: switch.iluminacao_2_interruptor_1
            name: Iluminação 2 — Ponto 1
            icon: mdi:ceiling-light
            features:
              - type: toggle

          - type: tile
            entity: switch.iluminacao_2_interruptor_2
            name: Iluminação 2 — Ponto 2
            icon: mdi:ceiling-light
            features:
              - type: toggle

          - type: tile
            entity: switch.iluminacao_2_interruptor_3
            name: Iluminação 2 — Ponto 3
            icon: mdi:ceiling-light
            features:
              - type: toggle

      # ── Ambientes específicos ────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Ambientes
            heading_style: title
            icon: mdi:floor-plan

          - type: tile
            entity: switch.led_cozinha_interruptor_1
            name: LED da cozinha
            icon: mdi:led-strip-variant
            features:
              - type: toggle

          - type: tile
            entity: switch.balcao_interruptor_1
            name: Balcão
            icon: mdi:countertop
            features:
              - type: toggle

          - type: tile
            entity: switch.spot_interruptor_1
            name: Spot
            icon: mdi:spotlight-beam
            features:
              - type: toggle

          - type: tile
            entity: switch.penteadeira_interruptor_1
            name: Penteadeira
            icon: mdi:mirror
            features:
              - type: toggle

          - type: tile
            entity: switch.quarto_interruptor_1
            name: Quarto
            icon: mdi:bed
            features:
              - type: toggle

          - type: tile
            entity: switch.z_alberto_interruptor
            name: Z-Alberto
            icon: mdi:power-socket-de
            features:
              - type: toggle

      # ── Acesso + atalhos rápidos ─────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Acesso
            heading_style: title
            icon: mdi:gate

          # Portão com confirmação — evita abrir sem querer no celular
          - type: tile
            entity: switch.fechadura_portao_interruptor_1
            name: Portão
            icon: mdi:gate-open
            tap_action:
              action: toggle
              confirmation:
                text: Abrir/fechar o portão?

          - type: heading
            heading: Atalhos
            heading_style: subtitle
            icon: mdi:gesture-tap-button

          - type: button
            name: Apagar todas as luzes
            icon: mdi:lightbulb-off-outline
            show_state: false
            tap_action:
              action: perform-action
              perform_action: homeassistant.turn_off
              target:
                entity_id:
                  - switch.iluminacao_1_interruptor_1
                  - switch.iluminacao_1_interruptor_2
                  - switch.iluminacao_1_interruptor_3
                  - switch.iluminacao_2_interruptor_1
                  - switch.iluminacao_2_interruptor_2
                  - switch.iluminacao_2_interruptor_3
                  - switch.led_cozinha_interruptor_1
                  - switch.balcao_interruptor_1
                  - switch.spot_interruptor_1
                  - switch.penteadeira_interruptor_1
                  - switch.quarto_interruptor_1

          - type: button
            name: Modo filme
            icon: mdi:movie-open-outline
            show_state: false
            tap_action:
              action: perform-action
              perform_action: homeassistant.turn_off
              target:
                entity_id:
                  - switch.iluminacao_1_interruptor_1
                  - switch.iluminacao_1_interruptor_2
                  - switch.iluminacao_1_interruptor_3
                  - switch.spot_interruptor_1

  # ═══════════════════════════════════════════════════════════════
  - title: Energia
    path: energia
    icon: mdi:flash
    type: sections
    max_columns: 2

    sections:
      - type: grid
        cards:
          - type: heading
            heading: Consumo acumulado
            heading_style: title
            icon: mdi:counter

          - type: tile
            entity: sensor.z_alberto_energia_total
            name: Z-Alberto
            icon: mdi:lightning-bolt

          - type: tile
            entity: sensor.led_cozinha_energia_total
            name: LED da cozinha
            icon: mdi:lightning-bolt

      - type: grid
        cards:
          - type: heading
            heading: Histórico (7 dias)
            heading_style: title
            icon: mdi:chart-line

          - type: statistics-graph
            title: Energia por dia
            chart_type: bar
            period: day
            days_to_show: 7
            stat_types:
              - state
            entities:
              - sensor.z_alberto_energia_total
              - sensor.led_cozinha_energia_total

  # ═══════════════════════════════════════════════════════════════
  - title: Servidor
    path: servidor
    icon: mdi:server
    type: sections
    max_columns: 2

    sections:
      - type: grid
        cards:
          - type: heading
            heading: Saúde do servidor
            heading_style: title
            icon: mdi:heart-pulse

          - type: gauge
            entity: sensor.processor_use
            name: CPU
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 60
              red: 85

          - type: gauge
            entity: sensor.memory_use_percent
            name: Memória
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 70
              red: 90

          - type: gauge
            entity: sensor.disk_use_percent
            name: Disco
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 75
              red: 90

          - type: tile
            entity: sensor.processor_temperature
            name: Temperatura da CPU
            icon: mdi:thermometer

      - type: grid
        cards:
          - type: heading
            heading: Serviços
            heading_style: title
            icon: mdi:apps

          - type: markdown
            content: >
              - [Jellyfin](http://10.0.0.103:8096)

              - [qBittorrent](http://10.0.0.103:8080)

              - [CasaOS](http://10.0.0.103)

          - type: history-graph
            title: Uso nas últimas 24h
            hours_to_show: 24
            entities:
              - sensor.processor_use
              - sensor.memory_use_percent
